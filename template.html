<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Tomohiro Shioiri Archive</title>
    <!-- 階層の深さに応じて自動計算されたCSSパスが挿入されます -->
    <link rel="stylesheet" href="{{RELATIVE_DEPTH}}assets/css/style.css">
    <style>
        #menu-toggle { display: none; }
        .menu-btn { cursor: pointer; float: right; font-weight: bold; border: 1px solid #e5e5e5; padding: 5px 10px; border-radius: 3px; }
        .nav-menu { display: none; list-style: none; padding: 10px 0; border-top: 1px solid #e5e5e5; clear: both; }
        #menu-toggle:checked ~ .nav-menu { display: block; }
        .nav-menu li { margin: 5px 0; }
        .nav-menu a { text-decoration: none; }
        header { padding-bottom: 20px; border-bottom: 1px solid #e5e5e5; margin-bottom: 30px; }
        .post-date { color: #666666; font-size: 0.9rem; margin-bottom: 20px; display: block; }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1><a href="{{RELATIVE_DEPTH}}index.html" style="color:inherit; text-decoration:none;">Tomohiro Shioiri</a></h1>
            <p>アーカイブウェブサイト</p>
            
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-btn">Menu</label>
            <ul class="nav-menu">
                <li><a href="{{RELATIVE_DEPTH}}index.html">ホーム (最新記事)</a></li>
            </ul>
        </header>
        
        <section>
            <h2>{{TITLE}}</h2>
            <time class="post-date">日付: {{DATE}} | カテゴリ: {{CATEGORIES}} | タグ: {{TAGS}}</time>
            <article>
                {{BODY}}
            </article>
        </section>
        
        <footer>
            <p><small>Hosted on GitHub Pages — Theme by orderedlist</small></p>
        </footer>
    </div>
</body>
</html>
