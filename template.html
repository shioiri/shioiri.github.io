<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Tomohiro Shioiri Archive</title>
    <link rel="stylesheet" href="{{RELATIVE_DEPTH}}assets/css/style.css">
    <style>
        /* ==========================================================================
           レイアウト＆レスポンシブ制御回路（既存のスタイルシートと調和させる修正）
           ========================================================================== */
        
        /* PC大画面（768px以上）のデフォルト配置 */
        @media screen and (min-width: 768px) {
            .wrapper {
                display: flex !important;
                flex-direction: row;
                justify-content: space-between;
                max-width: 860px;
                margin: 0 auto;
                padding: 40px 20px;
            }
            header {
                width: 270px !important;
                float: none !important;
                position: sticky;
                top: 40px;
                height: fit-content;
                border-right: 1px solid #e5e5e5;
                padding-right: 30px;
                margin-bottom: 0 !important;
            }
            section {
                width: 520px !important;
                float: none !important;
                padding-left: 30px;
                margin-top: 0 !important;
            }
            /* 大画面側ではハンバーガーメニューのボタンを隠蔽 */
            #menu-toggle, .menu-btn { display: none !important; }
            .nav-menu { display: block !important; border-top: none !important; }
        }
        
        /* ナビゲーションメニューの意匠構造 */
        .nav-menu {
            list-style: none;
            padding: 0;
            margin: 20px 0 0 0;
        }
        .nav-menu li { margin: 12px 0 !important; list-style: none !important; }
        .nav-menu a { text-decoration: none; font-weight: 600; color: #111111; }
        .nav-menu a:hover { text-decoration: underline; }
        
        /* メニュー内の小見出し */
        .menu-subtitle {
            font-size: 0.85rem;
            color: #666666;
            margin: 25px 0 5px 0;
            padding-bottom: 3px;
            border-bottom: 1px dashed #e5e5e5;
            font-weight: bold;
        }
        .sub-menu {
            list-style: none;
            padding-left: 10px;
            margin: 0;
            font-size: 0.9rem;
        }
        .sub-menu li { margin: 6px 0 !important; list-style: none !important; }
        .sub-menu a { font-weight: normal; color: #555555; }
        .disabled-link { color: #999999 !important; cursor: not-allowed; font-size: 0.85rem; }

        /* 共通意匠デザイン */
        .post-date-meta { color: #666666; font-size: 0.9rem; margin-bottom: 20px; display: block; }
        .archive-list { list-style: none; padding-left: 0; }
        .archive-list li { padding: 10px 0; border-bottom: 1px solid #f5f5f5; display: flex; justify-content: space-between; }
        .archive-list .date { color: #666666; font-size: 0.9rem; margin-left: 15px; }

        /* ==========================================================================
           スマホ小画面（767px以下）のレイアウト変更・インターロック
           ========================================================================== */
        @media screen and (max-width: 767px) {
            .wrapper {
                display: block;
                padding: 20px;
            }
            header {
                width: 100% !important;
                border-bottom: 1px solid #e5e5e5;
                padding-bottom: 15px;
                margin-bottom: 25px;
            }
            section {
                width: 100% !important;
            }
            
            /* スマホ環境下のみハンバーガーメニューボタンを出現させる */
            .menu-btn {
                cursor: pointer;
                float: right;
                position: relative;
                width: 30px;
                height: 24px;
                display: block;
                z-index: 10;
                margin-top: -45px; /* タイトルの位置に追従 */
            }
            .menu-btn span, .menu-btn span::before, .menu-btn span::after {
                content: '';
                display: block;
                height: 2px;
                width: 100%;
                background-color: #111111;
                position: absolute;
                transition: all 0.3s ease-in-out;
            }
            .menu-btn span { top: 11px; }
            .menu-btn span::before { top: -8px; }
            .menu-btn span::after { top: 8px; }
            
            #menu-toggle:checked ~ .menu-btn span { background-color: transparent; }
            #menu-toggle:checked ~ .menu-btn span::before { transform: rotate(45deg); top: 0; }
            #menu-toggle:checked ~ .menu-btn span::after { transform: rotate(-45deg); top: 0; }
            
            .nav-menu {
                display: none;
                clear: both;
                border-top: 1px solid #e5e5e5;
                padding-top: 10px;
            }
            #menu-toggle:checked ~ .nav-menu {
                display: block;
            }
        }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1><a href="{{RELATIVE_DEPTH}}index.html" style="color:inherit; text-decoration:none;">Tomohiro Shioiri</a></h1>
            <p>アーカイブウェブサイト</p>
            
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-btn"><span></span></label>
            
            <ul class="nav-menu">
                <li><a href="{{RELATIVE_DEPTH}}index.html">トップページ</a></li>
                <li><a href="{{RELATIVE_DEPTH}}profile.html">プロフィール</a></li>
                
                <div class="menu-subtitle">月別アーカイブ</div>
                <ul class="sub-menu">
                    {{DYNAMIC_MONTHLY_MENU}}
                </ul>
                
                <div class="menu-subtitle">分類・検索</div>
                <ul class="sub-menu">
                    <li><span class="disabled-link">カテゴリ (準備中)</span></li>
                    <li><span class="disabled-link">タグ (準備中)</span></li>
                    <li><span class="disabled-link">検索 (準備中)</span></li>
                </ul>
            </ul>
        </header>
        
        <section>
            <h2>{{TITLE}}</h2>
            {{META_INFO}}
            
            <article>
                {{BODY}}
            </article>
            
            <footer>
                <p><small>Hosted on GitHub Pages — Theme by orderedlist</small></p>
            </footer>
        </section>
    </div>
</body>
</html>
