<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}} - Tomohiro Shioiri Archive</title>
    <link rel="stylesheet" href="{{RELATIVE_DEPTH}}assets/css/style.css">
    <style>
        /* ==========================================================================
           純CSSハンバーガーメニュー（ホバー時に三本線から✕へアニメーション）
           ========================================================================== */
        #menu-toggle { display: none; }
        
        /* メニューボタンの筐体 */
        .menu-btn {
            cursor: pointer;
            float: right;
            position: relative;
            width: 30px;
            height: 24px;
            display: block;
            z-index: 10;
        }
        
        /* 三本線の共通デザイン定義（絶対配置） */
        .menu-btn span,
        .menu-btn span::before,
        .menu-btn span::after {
            content: '';
            display: block;
            height: 2px;
            width: 100%;
            background-color: #111111;
            position: absolute;
            transition: all 0.3s ease-in-out;
        }
        
        /* 各線の初期位置設定 */
        .menu-btn span { top: 11px; }
        .menu-btn span::before { top: -8px; }
        .menu-btn span::after { top: 8px; }
        
        /* 変化条件：チェックボックスがON、またはボタンにマウスカーソルが乗った（ホバー）時 */
        #menu-toggle:checked ~ .menu-btn span,
        .menu-btn:hover span {
            background-color: transparent; /* 中央の線を消去 */
        }
        #menu-toggle:checked ~ .menu-btn span::before,
        .menu-btn:hover span::before {
            transform: rotate(45deg);
            top: 0;
        }
        #menu-toggle:checked ~ .menu-btn span::after,
        .menu-btn:hover span::after {
            transform: rotate(-45deg);
            top: 0;
        }
        
        /* メニュー展開時のリストデザイン */
        .nav-menu {
            display: none;
            list-style: none;
            padding: 15px 0;
            border-top: 1px solid #e5e5e5;
            clear: both;
        }
        #menu-toggle:checked ~ .nav-menu {
            display: block;
        }
        .nav-menu li { margin: 8px 0; }
        .nav-menu a { text-decoration: none; font-weight: 600; }
        
        /* ヘッダー全体の余白微調整 */
        header { padding-bottom: 20px; border-bottom: 1px solid #e5e5e5; margin-bottom: 30px; }
        .post-date-meta { color: #666666; font-size: 0.9rem; margin-bottom: 20px; display: block; }
        
        /* 記事一覧ページ用のリンク一覧スタイル */
        .archive-list { list-style: none; padding-left: 0; }
        .archive-list li { padding: 10px 0; border-bottom: 1px solid #f5f5f5; display: flex; justify-content: space-between; }
        .archive-list .date { color: #666666; font-size: 0.9rem; margin-left: 15px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1><a href="{{RELATIVE_DEPTH}}index.html" style="color:inherit; text-decoration:none;">Tomohiro Shioiri</a></h1>
            <p>アーカイブウェブサイト</p>
            
            <!-- 新機構ハンバーガーメニュー（JS不要） -->
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-btn"><span></span></label>
            
            <ul class="nav-menu">
                <li><a href="{{RELATIVE_DEPTH}}index.html">ホーム (最新記事)</a></li>
            </ul>
        </header>
        
        <section>
            <h2>{{TITLE}}</h2>
            <!-- 個別記事の時だけ日付メタデータを表示する枠（トップページでは空欄になる） -->
            {{META_INFO}}
            
            <article>
                {{BODY}}
            </article>
        </section>
        
        <footer>
            <p><small>Hosted on GitHub Pages — Theme by orderedlist</small></p>
        </footer>
    </div>
</body>
</html>
