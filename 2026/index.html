<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026年 記事一覧 - Tomohiro Shioiri Archive</title>
    <!-- 既存のローカルCSS（資産）を最優先で読み込み -->
    <link rel="stylesheet" href="../assets/css/style.css">
    
    <style>
        /* ==========================================================================
           Minimalテーマの資産を活かしたスクラッチ修正アドオン回路（決定版）
           ========================================================================== */

        /* 【問題2の解決】チェックボックスを如何なる環境でも絶対に非表示にする */
        #menu-toggle { display: none !important; }

        /* --------------------------------------------------------------------------
           1. PC大画面側（1025px以上）の処理：完全な2カラムを固定（ハンバーガー不要）
           -------------------------------------------------------------------------- */
        @media screen and (min-width: 1025px) {
            .wrapper {
                max-width: 860px !important;
                width: 100% !important;
                display: flex !important;
                flex-direction: row !important;
                justify-content: space-between !important;
            }
            header {
                width: 260px !important;
                float: none !important;
                position: sticky;
                top: 40px;
                height: fit-content;
            }
            section {
                width: 540px !important;
                float: none !important;
                margin-top: 0 !important;
            }
            /* 大画面ではハンバーガーボタンを完全隠蔽、メニューは常時露出 */
            .menu-btn { display: none !important; }
            .nav-menu { display: block !important; }
        }

        /* --------------------------------------------------------------------------
           2. スマホ・タブレット・中画面側（1024px以下）の処理：1カラム＋ハンバーガーメニュー
           -------------------------------------------------------------------------- */
        @media screen and (max-width: 1024px) {
            .wrapper {
                width: 90% !important;
                max-width: 640px !important;
                display: block !important;
                margin: 0 auto !important;
            }
            header {
                width: 100% !important;
                float: none !important;
                position: relative !important;
                border-bottom: 1px solid #e5e5e5;
                padding-bottom: 15px;
                margin-bottom: 25px !important;
            }
            section {
                width: 100% !important;
                float: none !important;
                margin-top: 0 !important;
            }
            
            /* この領域下でのみ、三本線ボタンを出現させる */
            .menu-btn {
                cursor: pointer;
                float: right;
                position: relative;
                width: 28px;
                height: 20px;
                display: block !important;
                z-index: 10;
                margin-top: -38px; /* タイトル右側へジャスト配置 */
            }
            .menu-btn span, .menu-btn span::before, .menu-btn span::after {
                content: '';
                display: block;
                height: 2px;
                width: 100%;
                background-color: #111111;
                position: absolute;
                transition: all 0.25s ease-in-out;
            }
            .menu-btn span { top: 9px; }
            .menu-btn span::before { top: -7px; }
            .menu-btn span::after { top: 7px; }
            
            /* ✕印変形ロジック */
            #menu-toggle:checked ~ .menu-btn span { background-color: transparent; }
            #menu-toggle:checked ~ .menu-btn span::before { transform: rotate(45deg); top: 0; }
            #menu-toggle:checked ~ .menu-btn span::after { transform: rotate(-45deg); top: 0; }
            
            /* 初期状態は非表示、チェックボックスON（ボタンタップ）で展開 */
            .nav-menu { display: none; clear: both; margin-top: 15px; }
            #menu-toggle:checked ~ .nav-menu { display: block !important; }
        }

        /* --------------------------------------------------------------------------
           3. メニュー内部・共通意匠デザイン（上書き干渉防止対策）
           -------------------------------------------------------------------------- */
        .nav-menu {
            list-style: none !important;
            padding: 0 !important;
            margin: 20px 0 0 0 !important;
        }
        .nav-menu li { margin: 10px 0 !important; list-style: none !important; }
        .nav-menu a { font-weight: bold; text-decoration: none; }
        
        .menu-subtitle {
            font-size: 0.8rem;
            color: #666666;
            margin: 25px 0 5px 0;
            padding-bottom: 3px;
            border-bottom: 1px dashed #e5e5e5;
            font-weight: bold;
        }
        .sub-menu { list-style: none !important; padding-left: 10px !important; margin: 0 !important; }
        .sub-menu li { margin: 6px 0 !important; list-style: none !important; font-size: 0.9rem; }
        .sub-menu a { font-weight: normal !important; color: #444444; }
        .disabled-link { color: #999999 !important; font-size: 0.85rem; cursor: not-allowed; }

        .archive-list { list-style: none !important; padding-left: 0 !important; }
        .archive-list li {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 0;
            border-bottom: 1px solid #eeeeee;
        }
        .archive-list .date { color: #666666; font-size: 0.85rem; white-space: nowrap; }
    </style>
    <!-- SNSシェア時のカード表示制御回路（OGP） -->
<meta property="og:title" content="2026年 記事一覧">

</head>

            <!-- スマホ開閉用隠蔽スイッチ -->
            <input type="checkbox" id="menu-toggle">

            <!-- 共通ナビゲーション回路 -->

</body>
