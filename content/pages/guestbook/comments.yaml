- id: 7
  author: 手塚一子（てずかかずこ）
  date: '2009-06-20 16:26'
  timezone: '+01:00'
  body: |-
    こんばんわ。
    加藤学さんのブログを見ています。長野第５区で彼を協力に応援している中年女性です。実は、イギリスに興味が有ります。出来たら将来短期留学してみたいのです。後、１０日で帰って来てしまわれるということで、とても残念ですが、そちらの様子（生活していく上で注意すべき事など）を教えて頂ければ有難いナーと。
    学さんとはどういうお知り合いですか？中学の時の同級生でしょうか？
    彼頑張っていますよ。帰国なさって時間が有りましたら、飯田、上伊那、下伊那方面もお訪ねください。
    もうしばらくの滞在を楽しんできてください。日本でお会いできたら良いですね。それではまた。
- id: 8
  author: しおいり
  date: '2009-06-20 22:22'
  timezone: '+01:00'
  body: |-
    はじめまして。
    僕のブログは今のところ専ら食べたものを記録することで
    家族向け「生存報告」みたいな感じになってますけど、
    帰ったら滞在中の思い出とかつらつら書こうと考えてます。
    帰国したら加藤にも会いに行くので、そのときいろいろお話ししましょう！
    イギリス、おすすめですよ。
- id: 9
  author: 手塚一子（てずかかずこ）
  date: '2009-07-02 23:26'
  timezone: '+09:00'
  body: |-
    お帰りなさい！！
    久々の日本はどうですか？
    逆カルチャーショックとかあるのでは？
    それにしても、一年間のイギリスでの語学研修とは本当にうらやましい限りです。イギリスがいいよ！と言う人が多いのでそこにしようかなと思っています。私の場合は、夫と猫をおいていかねばならないので、せいぜい1～2ヶ月でしょう。此れでは、ろくな勉強も出来ないと思うことしきりですが。。。
    また、是非、食事の事だけでなく文化や考え方、生活上の相違点などお書きください。あの癖のある話し言葉にはすぐなれましたか？
    湖水地方とか訪問してみたいです。
    それでは又。　　　　　　　　　　　　　　手塚一子、a big grandmother in
                                                        Minowa , Nagano
- id: 10
  author: 新井嘉明
  date: '2010-06-15 18:47'
  timezone: '-05:00'
  body: OB会の欄に一言書いたよ、貴君が中野の学校とは驚いた、小生は上高田国民学校（戦中昭和20年に上田へ）だよ。
- id: 11
  author: しおいり
  date: '2010-06-17 20:37'
  timezone: '-05:00'
  body: |-
    工場長も中野でしたか！
    僕の母校は最近になって統廃合で名前が変わってしまいましたが、
    竹馬の友とは今でも交流を続けています。
- id: 12
  author: 新井嘉明
  date: '2010-06-18 00:27'
  timezone: '-05:00'
  body: 古い話になるが1944年夏東京の小学校は学童疎開をした上高田は福島の磐城、確か桃園の子もいた、桃園の子は信州の箕輪にも疎開している、小生の上田は再疎開先、その後高校で福島時代の友と再会するという奇遇？もあった、もう半世紀以上前の話。
