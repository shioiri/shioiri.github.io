- id: 14
  author: 柘植　圭司
  date: '2011-07-15 20:29'
  timezone: '-04:00'
  body: |-
    この度は、遠い所より御心遣いいただき、ありがとうございます。
    　あまりにも突然で、未だに悲しみがわきません。５日午前４時過ぎ、
    トイレの前で倒れている所を、母が見つけ救急車を呼びましたが、時
    すでに遅く、変死扱いで警察が入り、父に会ったのは７時過ぎでした。
    　ばたばたと時が過ぎ、お礼も今頃になってしまいすみませんでした。
    　
    　塩入さん、体に気をつけて頑張って下さい。
- id: 15
  author: 前音楽隊長
  date: '2011-10-15 13:01'
  timezone: '-04:00'
  body: |-
    塩ちゃん、元気かい？
    また一緒にやりてーな。
    音楽に国境はないよ
    Rhythm&music aren`t the frontier!
    自分の中では、君の音楽が君自身
    それも受け入れてなおかつ自分もある
    思いも、思い出も、君がいたから、
    あのサウンドが出来た。
    うまいへた関係なく、あの音はあの頃でしか出せない
    故あって異国の地で暮している君と
    私はもう一度音楽がしたいと思う
    君が去り、隊は6年目のシーズンを迎えた
    君の地ならしした音楽隊はついにここまで来たというのを
    見せてあげたい
    本当はそんなことどうでもいいから
    一緒にまたあのステージに立ちたいと
    切に願う
    その時まで、楽しい音楽をエンジョイしてください
