<p>今回買ったのは、今や資産総額5兆円を突破した大人気投信「<a href="http://www.kokusai-am.co.jp/fund/html/gaiyou/148013.html">グロソブ毎月決算</a>」。投機的な運用というよりは、毎月の分配金を楽しむタイプの投資信託です。投信は前日の基準価格を参考に注文し、翌営業日の基準価格で購入するのですが、先週末8,084円だったものが今日は7,998円。結果的に1%ほど安く買えました。<br />
実はもう一種類、めちゃくちゃ投機的なやつも買ってあるのですが、負けたら恥ずかしいので銘柄はナイショにしておきます。こっちは逆に1%ほど値上がり。むふふ。楽しみ♪</p>
