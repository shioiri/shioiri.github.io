高雄の天気は晴れ。<br />
空港を出たら、もわっと重く蒸し暑い空気に気持ちも重たくなりましたが、<br />
タクシーの車内、ホテルの室内は冷房が効いていて快適です。<br />
ずいぶん高級なホテルでびっくり。<br />
受付も、ちゃんとしたレセプションルーム。<br />
部屋には果物が用意されてるし、ベッドが4つもあります。<br />
とりあえず、ワールドカップが観られる居酒屋さんへこれから行ってみます。</p>
