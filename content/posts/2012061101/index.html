<img src="https://ext.netlify.app/20120612-121004-2.jpg" alt="__ 2.JPG" /><br />
晩ご飯。料理頼まず、このパンだけ、というわけにはいかないんだろうか。<br />
<img src="https://ext.netlify.app/20120612-121004-3.jpg" alt="__ 3.JPG" /><br />
閉店間際。さっさと食べて会計済ませるあたり、実に日本人っぽい。<br />
<img src="https://ext.netlify.app/20120612-121004-4.jpg" alt="__ 4.JPG" /><br />
またアイス買ってきてしまった。</p>
