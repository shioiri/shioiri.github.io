  date: '2015-02-17 19:38'
  timezone: '+09:00'
  body: |-
    こんにちは。「誰だコイツは」って思っていると思うので、ちょっと解説です。
    横浜在住の税理士のオッサンです。
    かつて、ニュージャージーに１年半ぐらい住んでいて、ミツワ（当時はヤオハン）に通ったり
    髪の毛を切るのにわざわざフォートリーの美容院に行ったりしてました。
    当時よく行っていたホーリハンズってまだあるのかな、と、わざとカタカナで検索したら
    こちらがヒットしたので、Twitterなど拝見したところ、ツボだったので、フォローさせて
    頂きました。そんなにガッツリ絡むヤツではないので、こういうのは初期だけです。
    ちょっと見ただけで、かなり「どストライク」でした。また時間のある時に、ゆっくり読ませて頂きます。
    今は日本なんですね。
