- id: 521
  author: 加藤です。
  date: '2006-06-23 13:13'
  timezone: '+09:00'
  body: 出張お疲れ様です。台湾の懐かしい写真楽しく拝見しました。ビンラン小姐の写真が欲しかったなあ。ビンランはかみ続けると体が熱くなってきます。真っ赤な唾液になるので、常につばをはかなくてはなりません。試してみればよかったのに。
- id: 522
  author: しおいり
  date: '2006-06-24 13:03'
  timezone: '+09:00'
  body: 同行した現地スタッフが強くは勧めませんでしたので、僕も恐れをなして試すことは出来ませんでした。値段も安かったので、話のタネに試してくるべきでしたね。
