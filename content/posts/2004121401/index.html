<p><a href="http://www.kanken.or.jp/kanji/kanji2004/index.html">http://www.kanken.or.jp/kanji/kanji2004/index.html</a><br />
毎年恒例「今年の漢字」。選ばれたのは「災」でした。<br />
僕も、今年は「災」かな、と思ってました。<br />
（ほんとですよ。）<br />
「災い転じて福となす」との期待を込めた票も多かったそうだけど、僕もおんなじこと考えてました。<br />
（いや、ほんとですよ。だからどうしたってこともないですけど。）<br />
この僕も、平均的な大衆心理と同じ感覚を持ち合わせているようです。</p>
