  body: |-
    いよいよ英国だねえ、頑張ってね。羨ましい！
    日本のカレーが妙に恋しくなるからルーを持参した方がいいよ。
- id: 1336
  author: ギター２（かすがっち）
  date: '2008-06-24 23:21'
  timezone: '+09:00'
  body: |-
    こんばんわ。
    もうすぐ行ってしまうのかと思うと少し寂しいです。
    一年と言わず、うつ病とか言って、早く帰ってきてください。
    あと、カレーはＳ＆Ｂの缶カレー粉持っていってくださいな。
    あとは小麦粉と玉ねぎがあれば、むかーしのカレーになるよ。
    ブルドッグソースも必要か・・・。（歳がばれちゃうな）
- id: 1337
  author: しおいり
  date: '2008-06-25 04:37'
  timezone: '+09:00'
  body: |-
    バーミンガムにはバルティという名物カレー料理があるらしいです。
    これまで出張等では（他人に連れて行かれない限り）郷に入っては郷に従え的なメニューを心がけていたんですが、やっぱり１年ともなると日本の味が恋しくなっちゃうものですかね？
    好みのそばつゆも持って行った方が良いような気がしてきました。
