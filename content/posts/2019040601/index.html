<p>前にカルディで買った肉骨茶（バクテー）を調理。レシピ通りだと肉が相当多めだった。<br />
白胡椒がたっぷり入っており、途中の味見では辛くてビックリしたけど、魚醤（ナンプラー）で味を整えたら辛味がスッと消えていく不思議。</p>
<p>シンガポール料理つながりでサテも作ってみたけど、これが母に不評でがっかり。妻が言うのは、甘い味付けのものはご飯のおかずにならないのだと。いろいろと大変である。</p>
