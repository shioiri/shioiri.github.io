  body: |-
    ブリティッシュ・オープンいいですね～。
    俺も一回でいいから見に行きたい。イギリスにいればヨーロピアン選手権も見に行けますよ。ブリティッシュはプロアマ混合の大会らしいですが、そのほかの大会はアマチュアがほとんど。すごい演奏しているのに、アマチュアなんですよね～。
- id: 1396
  author: しおいり
  date: '2008-09-15 12:57'
  timezone: '+01:00'
  body: |-
    客層はほとんどが年輩のみなさんでした。
    モールで飾られた衣装を着た人が見の前で演奏しているのを見て、
    ちょっとだけセンチメンタルな気分を感じながら曲を聴いていました。
