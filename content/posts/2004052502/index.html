---
title: きょうの小池君
time: '21:15'
timezone: '+09:00'
---
<p>おれ、肝臓のデータが悪くてさ、食生活を改めないと早死にするよ、と主治医の先生に言われてるんだよ。<br />
そんな話をしていた三時休み、ジンジャーエールをゴクゴク飲む僕に『しおいりさん、早死にしたいですか?』と小池くん。<br />
今日もお昼にはマーボーライスとラーメンを軽々たいらげちゃったし。<br />
まったく自覚がない僕に、小池君も呆れたんでしょう。<br />
そんな今夜も、ミニストップでソフトクリーム。<br />
しかもサラミとチューハイをお持ち帰り。<br />
ホントに早死にしちゃうよ、このままじゃ…</p>
