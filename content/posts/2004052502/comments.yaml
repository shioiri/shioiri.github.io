  date: '2004-05-26 10:52'
  timezone: '+09:00'
  body: |-
    そんなしおちゃんにお薦めなのが、「ホッピー」でーす。
    ホッピーは一応ノンアルコールビールに属していて、カロリーもビールに比べて約1/3ぐらいだったかな？
    まあ、実際ホッピー飲むのも週末だけですけどね。焼酎ちょっと入れて。つまみは肉類は湯通ししたもの、ナッツ類はＢＡＤ．ですかね。食べてもゆでたソーセージ。
    後は、水、お茶。１日３Ｌくらいかな。
    腹半分、ほしい物ではなく、体が必要としてるものを摂るといいかも。まずは我慢、ガマン。
    そうそう、ＭＢＴの靴はいてウォーキングだよ！
- id: 79
  author: 鍛冶屋
  date: '2004-05-26 16:40'
  timezone: '+09:00'
  body: |-
    しおちゃん。今日いいこと聞きました。商社の方ですが。
    やはり、肝機能回復には水分。
    常温の水で、２～３Ｌは飲みましょう。
    ヘルシア飲んで、水飲んで、ずいぶん肝機能よくなったよとききました。
    コーヒーより水。これだね！
