- id: 126
  author: 小林　美砂
  date: '2008-07-14 16:31'
  timezone: '+09:00'
  body: 横浜にいる息子がかけはし食堂がのってるよと言うのでびっくりしました私はその近くにすんでますが私が小学生のころはそこはカレーハウスと言う名前でおしゃれなレストランで味もシェフが作るカレーと言う感じでライスもバターライスでした３０年の間になにがあったのでしょう？
- id: 127
  author: しおいり
  date: '2008-07-16 03:37'
  timezone: '+09:00'
  body: |-
    どうも！書き込みありがとうございます。
    実に得難い30年前の情報をありがとうございます。
    今でも充分おしゃれだと思いますよ。
    本場英国カレーにひけをとらない雰囲気だと思います！
    また行きたいなー。
- id: 128
  author: 運び屋
  date: '2010-01-21 01:46'
  timezone: '-06:00'
  body: 上田の方からのレポート写真付きで読ませいただきありがとうございます。我々仲間内で毎度通る度にあの怪しいカレー屋の話はつきません。やっぱり店内に入っても怪しいカレー屋ですね。オーダーと違うメニューが出てくるし、これたま怪しい店ですね。
- id: 129
  author: しおいり
  date: '2010-01-21 23:36'
  timezone: '-06:00'
  body: |-
    運び屋さん、こんにちは。コメントありがとうございます。
    なんか懐かしいですね。
    僕も今では本場英国風カレーを語れるようになりました。
    上田でもおいしいカレーを食べられるのですが、
    まだ当地（シカゴ）では見つからず口寂しい思いをしております。
