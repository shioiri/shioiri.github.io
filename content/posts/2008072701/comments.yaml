- id: 1365
  author: ギター２（かすがっち）
  date: '2008-07-28 21:15'
  timezone: '+09:00'
  body: |-
    しおちゃん、ご無沙汰ですー。
    もう、すっかり異国の人みたく、リラックスしてるみたいで安心しました。
    昨日、西塩田のお祭りあったよ。盛り上がってました。
    実は、なんか話が行き違ってたらしくて、うちらのバンドのエントリーが切れていなかったらしい。
    で、急遽、Ｋ沢さんの知り合い集めて３曲ライブでした。
    うちらのバンドも少々危ない感じ・・・というのは、ギター１が全然出てこなくなっちゃってね。
    しおちゃん帰ってくるまでバンド続いてるのかな？
    いや、続けなきゃね。
    もうじき、日本を離れて１カ月になるんだね。
    あと、１１カ月だぞ！！がんば、しおちゃん。
- id: 1366
  author: しおいり
  date: '2008-07-31 03:01'
  timezone: '+09:00'
  body: |-
    かすがっちさん、コメントありがとうございます。
    夏まつりへのエントリーが切れていなかったとのこと。
    私の確認不足をお詫びいたします。
    北さんにはメールが送れないので、よろしくお伝えください。
    何だか相変わらず観光モード全開ですが、
    そろそろ本気出して勉強モードに入ろうかと思います。
