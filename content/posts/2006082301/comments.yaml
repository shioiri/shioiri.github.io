  date: '2006-08-23 18:02'
  timezone: '+09:00'
  body: |-
    私の使い方：
    自分のメールボックス → Gmailに転送 → 自分のメールボックス2に転送
    ってやるだけでspamが取り除かれたメールだけが残ります。
    Gmail に POP で取りに行っても良いんですが、社内のサーバにPOPしたほうが早いのでGmailから随時送り込んでもらってます。
    spam除去のアルゴリズムが公開されていないようなので、ちょっとヒヤヒヤものですが。
