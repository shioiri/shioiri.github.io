- id: 1810
  author: ゆうこ
  date: '2011-10-01 18:59'
  timezone: '-04:00'
  body: |-
    無知な質問ですみませんが　エノラゲイって有名な人の名前ですか？　なんなんでしょう？
    80年代の私の大好きな曲にエノラゲイってのがあるんです。航空機の名前にされるくらいなので歴史的な人なんでしょうか？　それとも人の名前ではないのでしょうか？
- id: 1811
  author: しおいり
  date: '2011-10-02 12:42'
  timezone: '-04:00'
  body: |-
    コメントありがとうございます。エノラ・ゲイとは、広島へ原爆を投下したB-29爆撃機の名前です。パイロットのお母さんの名前だそうです。
    因みに、私の祖父は当機が飛び立ったテニアン島で戦死したと聞いており、そこへもいつか訪ねてみたいと思っています。
