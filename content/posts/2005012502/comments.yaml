- id: 159
  author: 残念！
  date: '2005-03-07 23:05'
  timezone: '+09:00'
  body: 主務者印を押してもらえなくなったのは今月からかもしれないですね｡先月の沖縄、月末の銀座では押して頂けました｡３／３に行った両国では通帳の最終段ということもあってか押して頂けましたが、今日の横浜では「印刷の関係で押せなくなりました」と断られました｡
- id: 160
  author: 浦河原 利樹
  date: '2005-03-15 18:33'
  timezone: '+09:00'
  body: |-
    主務者印を捺して貰えなくなったのは3月からなのでしょうか?
    それなら、私は3月1日に旧型(縦型通帳)がいっぱいになったので、新型に切り替えたのですが、何か偶然ではないものを感じてしまいます。
    乱筆失礼しました。
- id: 161
  author: しおいり
  date: '2005-03-17 01:23'
  timezone: '+09:00'
  body: |-
    コメントをありがとうございます。
    はんこがもらえなくなったのは今年１月なかば頃から、特に関東で徹底されているように思います。すでに全国へ飛び火しているのでしょうか。朱の鮮やかさも楽しみのひとつだったので、残念ですね。
