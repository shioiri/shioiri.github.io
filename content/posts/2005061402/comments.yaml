- id: 204
  author: 4O漬け
  date: '2005-06-15 08:10'
  timezone: '+09:00'
  body: この人を見て思い出しましたが、肥○児クラブで定例会の店を探していたところ、タイガーという店があったそうです。看板を見た所、すっぽん料理店で、たまにはいいかと店に入りすっぽん料理を頼んだそうです。するとマスターがこれも付けたほうがいいとオプションを勧めたのでそれも付けることにしたそうです。定例会も終わりお勘定をしたところ、料金が５倍になっていたそうです。そこで問題です、マスターに勧められたオプションとはなんだったでしょうか。
- id: 205
  author: しお
  date: '2005-06-17 10:13'
  timezone: '+09:00'
  body: |-
    答えは「ぽん」だって。
    すっぽんぽん盛りって意味らしい。
    知るかそんなもん。
