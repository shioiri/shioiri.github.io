<p>1950年のアメリカ映画。<br />
大金持ちの主人公が、出資するかわりに舞台の主役となるチャンスを得ました。ところが時は大恐慌。すべてをまかせていたおじさんが資産運用に失敗してしまいます。何とかして資金をおじさんに出させたい主人公は、48時間「イエス」を言わないという賭けに挑戦しますが・・・。<br />
超有名なタイトル曲、その歌詞の美しさを初めて知りました。</p>
