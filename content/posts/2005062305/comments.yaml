    フィリピンパブ初体験。
    一生懸命タガログ語の勉強をしてました。
    私＝ako
    あなた＝ikaw
    乾杯＝mabuhay
    塩＝asin
    ほくろ＝nunal
    ありがとう＝salamat po
    こんばんは＝magandang gabi
    おはようございます＝magandang umaga
    他にも夜の街ならではの言葉も。
    　　　　　（聞いたわけではない。一方的に教えられた。）
    maganda＝kawaii
    walang anoman po＝dousimasuka
    　　　　　（どういたしまして、といいたかったらしい。）
    malibog＝sukibe
    　　　　　（スケベ、といいたかったらしい。）
    ayoko＝yada
    sinungaling＝uso
    Bola bola＝gomasuri
    Babaero＝uwakimono
    mahal kita＝aisiteru
    ingat＝kiotskite
    　　　　　（気をつけて、といいたかったらしい。）
    samuling pagkikita＝matane
    ♥♥♥
    先生のMauiさんが、「あなた、Hindi po ako malibog。」
    と言うので、What meaning?と聞いてみたら、
    「sukibe janai」と書いて教えてくれました。
    お店の子にしたら、つっまんねー客！って感じだったのかな。
