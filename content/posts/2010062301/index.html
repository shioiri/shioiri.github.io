<p>アメリカでは州ごとに免許制度が異なるが、転居したら一定期間のうちにその州の免許を取らなければいけない決まりになっている。なので、早速ニュージャージー州の免許に切り替えた。<br />
<a href="https://ext.netlify.app/20100624-113502-1.jpg"><img src="https://ext.netlify.app/thumb.20100624-113502-1.jpg" alt="R0019005.jpg" /></a><br />
切り替えるのにイリノイで免許を新しく取るよりも手数料が高く、しかも有効期限が半分より短くなってしまった。まったく訳がわからない。<br />
ガソリン以外、すべての物価が前いたとこより高いです。</p>
