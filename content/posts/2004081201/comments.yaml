- id: 105
  author: 鍛冶屋
  date: '2004-08-13 11:00'
  timezone: '+09:00'
  body: |-
    ミヤノに「マイスター１号」誕生か！！！
    しおちゃん、是非、マイスターになってください。
    日本の技能検定は県表彰レベルで、国家認定ではありません。（だと認識してましたが‥）
    ドイツの様に、マイスター制度でモノ作りの人たちが尊敬され、認められるシステムが日本にはありません。
    ミヤノで、マイスター制を作り、第一号になってください。そうすれば、ＣＥ課は安泰でしょう。
    なんにしても、機械の構造から、削りから、電気から、‥トータルで仕事ができないと話になりません。本人がやる気があるのなら、トライしてもいいんじゃないですか？
    プラスになることはあっても、マイナスにはならないでしょう。
    総合的に機械の状態を判断して、指示を出す。かっこいぃ～。日々是修行。休む暇ありません。
    ガンバレ！
- id: 106
  author: しおいり
  date: '2004-08-14 14:23'
  timezone: '+09:00'
  body: この先、本体が効率的な量産に専念するということになると、面倒な部分はみんな僕らのほうに押し付けられてくると思うんですよね。でもそれを「面倒な部分」とか「押し付けられた」と思わず、いかにうまく取り込んで、利益に結びつけるかだと思うんですよ。要は意識の持ち方だけだと思うんですけどね。お盆明けから具体的な動きが出てくると思いますが、僕は楽しみにしてますよ。でも異動に不安を感じている人から見ると、アイツは気楽でいいよなぁって後ろ指刺されちゃいそうですよね。
