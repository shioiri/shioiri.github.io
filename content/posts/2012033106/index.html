<img src="https://ext.netlify.app/20120401-132002-2.jpg" alt="__ 2.JPG" /><br />
今回初めて格安航空会社を利用。機内持ち込み手荷物が有料、しかも預ける場合よりも高い。僕は工具があるから、手荷物は当初から預けること前提。<br />

お昼ごはん。これがなかなか美味しかった。<br />
<img src="https://cdn-ak.f.st-hatena.com/images/fotolife/s/shioiri/20200421/20200421155307_original.jpg" /><br />
晩ごはん。これもなかなか美味しかった。<br />
<img src="https://cdn-ak.f.st-hatena.com/images/fotolife/s/shioiri/20200421/20200421155314_original.jpg" /><br />
ホテルに戻り、飲み直しのつもりで隣のレストランのバーへ。たまたま隣り合ったガス管工（エドさん）と酒を飲み交わす。どうやって部屋に戻ったか覚えてない。俺がおごる！今度は俺だ！と派手に飲み競ったが、ちゃんと払ったのかな俺。</p>
