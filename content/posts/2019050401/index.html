<p>民宿で朝食をいただいたあと、両津から新潟までフェリー。船内で食べたピザが小さかった。お昼は阿賀野川SAで、カツカレーラーメン。福島県をスルーして、鵜の浜温泉で汗を流したあと妻の実家。ごちそうがいっぱい。</p>
<p>ごちそうさまでした！</p>
