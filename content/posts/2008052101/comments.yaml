  body: |-
    人生で最大のチャンスであり、死ぬ気で語学を習得するべし。
    あまくはない、現地では日本語を一切しゃべらず、英語で考え英語で吐き出すことを心得よ。英語で話す友人と２４時間付き合い、異国の人種の中で自分と適した親友を見つけるべし。「高校時代の留学組ではない！」人生で最大のチャンスであり、ラストチャンスと思い塩入君には頑張ってほしい！
