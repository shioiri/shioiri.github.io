  body: |-
    おひさ！
    今日、刈谷のＬソンに抹茶バージョン発見。
    西尾市が抹茶の産地だからか‥
    お近くに出張の際には是非！
- id: 1257
  author: しおいり
  date: '2008-03-13 23:41'
  timezone: '+09:00'
  body: ちかごろロールちゃんの供給が潤沢になってる感じしませんか？
- id: 1258
  author: mitu
  date: '2008-03-14 10:25'
  timezone: '+09:00'
  body: しおいりさん抹茶のロールちゃん（おじいちゃんの柄）ですが、上田でも買えると思います。この間上田のどこでかったか覚えてないのですが、抹茶を買って食べましたよ。たぶん創造館の近くのセブンだったかな？
- id: 1259
  author: しおいり
  date: '2008-03-14 21:29'
  timezone: '+09:00'
  body: |-
    抹茶はおじいちゃんなのか。
    この子も男の子だと思ったら「パパロールちゃん」なんだってね。
