- id: 46
  author: 永津兄ぃ
  date: '2004-02-27 18:35'
  timezone: '+09:00'
  body: これはこれは上田（営）のK氏ではありませんか！人間ある程度「妥協」というものも必要です。あまり「面食い」すぎるとT先輩の後を追いかけることになりかねません。ガンバレッ！さしずめ今日は月締めの宴会かな？いいなぁ～。おいらは明日、名古屋の例の店にいってきやーす！（予定では）ところで、「ななちゃん」って何？おじさんよくわからなーい。ではっ！
- id: 47
  author: しおいり
  date: '2004-02-28 12:50'
  timezone: '+09:00'
  body: |-
    僕は面食いじゃないですよ。
    でも、もう面倒なことはやだな、と。現実逃避モード。
    なお「ななちゃん」は佐久の野辺山観光というとこのバスで、消防団でよく使うんですよ。
    澄子監査役の告別式で送迎用にこのド派手なバスが来たときはちょっとアレでしたけど。
