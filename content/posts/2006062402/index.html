<p><img src="https://ext.netlify.app/blog-photo-1151124495.13-0.jpg" /><br />
このサイズで、何と定員19人の豪華バス。マッサージチェアとテレビが装備されていました。<br />
台湾では鉄道があまり信用されていないらしく、中・長距離交通には飛行機やバスが主に使われています。<br />
鉄道も、新幹線の開業を控えて大がかりな巻き返し策を打っており、セブンイレブンと組んで駅の機能を充実させたり、グッズ販売の強化に力を入れているようです。<br />
ここ高雄には、年末までに地下鉄も開業するそうです。次に訪れるときには、交通環境が一変しているかもしれません。</p>
