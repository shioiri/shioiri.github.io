<p>金曜休みのお昼ごはんは、通勤途中で気になっていた「王様の餃子」へ。よくある中国食堂だったけど餃子は美味であった。<br>そのあとの「haruiro」もお初。スクープで盛り付けるジェラートと、持ち帰りのシュークリーム、いずれも美味であった。</p>
