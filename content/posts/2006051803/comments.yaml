- id: 483
  author: しお
  date: '2006-05-20 15:19'
  timezone: '+09:00'
  body: |-
    auユーザなら完璧ですよ。
    ケータイへの受信をGmailに転送し、ケータイからの発信をGmailにBccしておけばオッケー。
    Gmailのアカウントにauのアドレスを設定しておけば、ケータイからの発信もGmailの「送信済み」に残るようになりますよ。
    ドコモにも転送と自動Bccがあればなぁ。またauに戻そうかな。
    Invite送っておきますね。
