  body: |-
    死刑判決は、合憲と思います。二人も、殺害して、自身は、生き抜くと、いうのは、許せない行為です。
    また、無期懲役と言うのも、国民の税金を使って、食事代などを出すので、正に、税金も使用するという、結果ですので、ただでさえ、年金の配布量が少ないから、これ以上、重大犯罪人に、税金を使う事は、国家の衰退に、つながります。アメリカなどの様に、犯罪者が、食事などをする場合は、家族や親類や、友人などから、お金を寄付していただくのが、良いと思います。殺害者は、特にそう思います。
