    俺は、
    日曜日「努力」
    月曜日から金曜日「デート」
    土曜日「秘密」
    でした。
    脳内イメージは「悩」の真ん中に「愛」
    とエロい結果に。。。
    そう、「年賀エコーはがき」長野県内でも発売しています。
    インクジェット紙で「コジマ」の宣伝入り。
