- id: 287
  author: しおいり
  date: '2005-09-30 16:33'
  timezone: '+09:00'
  body: |-
    土曜日はお客さんの社員食堂が休みだったので、
    現地の方が近くのお店からタコスを買ってきてくれました。
    おいしかったですよ。
    出発前、アメリカのメンバーから、メキシコへ出張に行った人は必ずおなかをこわすと聞いていたんですが、最低でも水と氷には気をつけろと言われていたので、その忠告を忠実に守り、そっちのトラブルは一切なし。
    とても、楽しい出張になりました。
