  date: '2008-10-27 11:30'
  timezone: '+00:00'
  body: |-
    ご無沙汰してます。先日は『鎌倉市・上田市姉妹都市交流演奏会』にお酒を頂きまして、本当にありがとうございました。わざわざ飛行機で持ってきて頂いて？
    おかげ様で、レセプションも演奏会も大盛況で、シティーブラスの皆さんも、喜んで帰りました。そちらでは、楽器を演奏する機会はないの？
- id: 1410
  author: しおいり
  date: '2008-10-27 19:44'
  timezone: '+00:00'
  body: |-
    演奏会お疲れさまでした。応援に行かれなくてすみません。
    こちらは金管バンドが盛んと聞いていますが、演奏の機会はないですねぇ。
    またすぐに定期演奏会かと思いますが、また何か送りますね。
    ではでは。
