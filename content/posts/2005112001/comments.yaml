  body: tar.gzファイルをFTPで上げ、tarコマンドで展開させてみたり、今までFTPで上げては消していたファイルの移動をmvコマンドでやってみたり、当たり前のことができるようになりました。でもいちいち「初心者向けコマンド集」みたいなウェブサイトを見ながらなので、サラリと当たり前のようにこなすことはできないです。。。
