  date: '2004-05-16 14:16'
  timezone: '+09:00'
  body: |-
    管用テーパーネジＲ5/8について
    Ｒなので外形ネジですよね。
    確かに、ＪＩＳの規格にはありませんね。古いＪＩＳの規格ＰＴにもありません。参考までに京セラの外形ネジきりホルダー、チップの選定基準でも４分から６分にとんでしまい５分はありません。（ピッチが１４山のもと共用できるとおもいますが）
    しかーし！ＯＳＧ（最新のカタログではないですが）の管用テーパータップにはＲｃ5/8－１４山は存在します。つでに、ゲージもＰＴ規格ではありますが存在します（おねじかめねじかは不明）。
    ということは、どこかが、規格外の使用で、かつ、かなりの使用頻度があるためにカタログにのっていると思われます。以前、私もお世話になりましたが、ＯＳＧへメールで問い合わせしたこともあります。
    ここでちょっと注意！
    ねじの規格はＰＴからＲに変わっても基本的にねじは寸法的には同じですが、ゲージは、ゲージ製作する上で寸法の許容範囲が違いますので、Ｒ表記のねじにはＲのゲージを使用してください。
    いろんな工具メーカー、ゲージメーカーに問合せしたほうがいいですね。特に、ゲージの有無に関して、無ければ最低納期１ヶ月位はかかるでしょうし‥
    後は、図面を出してきたところ（設計者）に、ねじの規格（外形、有効径、基準位置、有効長さ等）と、ゲージの貸出しができるか問合せたほうがいいかな？（ＪＩＳ規格にないということで）
    意外と図面書いた人も知らなかったということもあります。
    私でお手伝いできるのはこんなところです。
    お役に立てなくてスミマセン。では、よい休日を！
