  body: |-
    初めまして。
    と言っても、音楽隊でお世話になっております。
    丸子のリエです。（って言って解かりますか！？昨日、フルートでソロやった・・。）
    早速、ブログ見させて頂きました。
    昨日はお疲れ様でした。
    ご協力のお陰で無事に演奏会を終える事が出来ました！
    有難うございました。
    これからも合同で演奏する事があるかと思いますが、今後も宜しくお願い致します。
    またブログに遊びに来させて頂きますね！！
    私もブログやってますので、是非遊びに来て下さい♪
    お待ちしております☆
