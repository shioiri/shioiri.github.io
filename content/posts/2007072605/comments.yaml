    ぜーんぜん、元気じゃないです。
    調子戻るのにあと半月はかかりそう。
    名古屋に来てたんだね。
    初☆山はどうでした？ホッピー！あるんです。山ちゃんには。
    最近、bimota に一目惚れ。
    カッコイイィィ・・・　美しいぃぃ・・・
    でも、高すぎて手が出ない。よしっ！宝くじだ！
    などと、お気楽、極楽な思考しかできません。
    暑すぎてやってられないよぉ～
    んじゃ！またね～
