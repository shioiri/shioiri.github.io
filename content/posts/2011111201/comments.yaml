  timezone: '-05:00'
  body: |-
    初めましてではないのですが、大阪のＯＤＡＨＡＲＡ製作所の者です。
    その節はいろいろとお世話になりました。
    ＯＤＡＨＡＲＡ製作所の誰かは解からないとは思いますが、会社の方へは度々来ていただいたので会社自体は覚えておられるのではないでしょうか？
    会社の方に塩入さんはアメリカに居るよと言われ、パソコンで検索していたら
    このブログを見つけました。へ～～やっぱりしおいりさん世界で活躍されてたんですね＾＾
- id: 1813
  author: しおいり
  date: '2011-11-14 08:07'
  timezone: '-05:00'
  body: |-
    サングラスの芸人さんからコメント！と思いビックリしました。
    S田さんやムーブマスター君は変わらずお元気でご活躍ですか。
    こちらに来て２年！になります。コールセンターを飛び出してからですと、
    もう３年半になるんですねぇ。（進歩してないなぁ）
    夜中に何か設備でお困りごとがありましたら、
    似顔絵のところに書いてあるアドレスへメールでお知らせください。
    ケータイに転送されます。
    部品以外のことでしたら、何とかさせていただきますので。。。
    コメントありがとうございます！
