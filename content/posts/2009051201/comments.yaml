- id: 1548
  author: ギター２（かすがっち）
  date: '2009-05-12 22:40'
  timezone: '+01:00'
  body: |-
    ご無沙汰してます。
    今日の新聞の経済欄みたら、本社工場閉鎖との記事があり、
    大変びっくりしました。
    でも、そちらにも情報は伝わっているとのことで安心しました。
    しかし、どこに行くことになるんでしょう？
    帰国したら、早々に遠くの事業所になってしまうのでしょうか？
    そう言った意味では、少し心配しています。
- id: 1549
  author: しおいり
  date: '2009-05-12 23:06'
  timezone: '+01:00'
  body: |-
    うはぁ！ご無沙汰です！
    思い出してくれたんですね、ありがとうございます。
    まー今はただ、かっこつけて言えば「人事を尽くして天命を待つ」
    でいいのかな？残りの期間をしっかり勤め上げたいと考えてます。
- id: 1550
  author: ギター２（かすがっち）
  date: '2009-05-13 01:11'
  timezone: '+01:00'
  body: |-
    結構しおちゃんのブログ見てますよ。週に１回は見てるかな。
    他のバンドメンバーは見てないと思うけどね。
    「人事を尽くして天命を待つ」とは、いかにもしおちゃんらしい。
    ＰＴＡバザーが６月に変更になってしまい、メンバーは青ざめながら
    ライブに向けて練習しているこの頃です。
    ドラム担当がギターも上手いので、私のへたっぴギターを補完すべく
    ギターに変更し、ドラムパートはＫさんの打ち込みマシンからの出力
    で自動演奏させるという手段でなんとかしのいでいます。
    しおちゃんが近い場所に帰ってきて、余裕があるなら是非ドラマーとして
    帰ってきてもらいたいくらいだが、ちょっと先が見えないもんね。
    先ずは、無事帰国することを目標で！
    忙しいと思いますが、是非元気な顔を見せて下さい。
    待ってます。
