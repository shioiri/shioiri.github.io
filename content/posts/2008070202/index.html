<p><a href="https://ext.netlify.app/20080702-095002-1.jpg"><img src="https://ext.netlify.app/thumb.20080702-095002-1.jpg" alt="TS3E1286.JPG" /></a><br /> 荷物の重量オーバーを指摘されたら困ると思い、少し早く空港に着きました。一度閉めたスーツケースはやたら開けるものじゃないです。昨夜は落ち着かず、何度も出し入れして余計な時間を費やしてしまいました。でも今ここまで順調なのは、昨夜の周到な準備の結果だと思いたいです。あとは段取りを短時間、効率的にこなせる術を身に付ければ何事もラクになるんだろうなぁ。不惑寸前にして自分を鍛えるいい機会をいただきました。ちょっくら、いってきますね。</p>
