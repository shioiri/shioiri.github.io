- id: 1736
  author: かすがっち
  date: '2010-04-23 06:20'
  timezone: '-05:00'
  body: |-
    急なことで、さぞかし寂しいことと思います。
    私の父も私が３２歳のときにしおちゃんの親父さんと同じ年齢で亡くなりました。
    久々に自分の親父のことを思い出しました。
    親父さんのご冥福をお祈りいたします。
