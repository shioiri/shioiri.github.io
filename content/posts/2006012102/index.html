出前ができる店、近所ではピザ以外にはみつからず。そこで、球場近くの雷ラーメンへ行ってみるも、なんと意外や意外の繁盛店。待つのもイヤだったので、祢津街道まで足を伸ばし、やんちゃラーメン。</p>
<!--more-->

<p>おいしかったですよ。気に入りました。席にトッピングの「ドライにんにく」が置いてあるけど、調子に乗ってかけすぎないように。スープに浸ると、香りも辛さも元にスライスにんにくに戻ります。<br />
次回は昭月食堂まで足を伸ばしてみようかな。</p>
