    炊き出し…
    5日に平井寺公民館で食べました。
    塩味の効いた熱々のふっくらしたおにぎりが、
    非常に美味しかったです。
    地元の方の煮物とか。
    公民館の前の道路で食べましたが、
    どこかの報道機関に写真撮られました。
