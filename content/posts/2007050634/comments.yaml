  timezone: '+09:00'
  body: |-
    昨日、今日と大変お疲れ様でした。
    無事に鎮火したんですよね…？
    祭りが始まってしばらくして火災の知らせを聞き、分団は違うけど他人事じゃないような気がしてました。
    しかし…(祭りの)撤収中、そんな事関係ないとばかりに『かき氷買って』とガキみたいな事をほざく同じ分団の同級生(しかも嫌われ者)が余りにも腹立たしく…。
    とにかく、乾燥しやすく風も強いこの時期…我々も気をつけなきゃいけないですね。
    真田にもお構いナシのジジババは結構多いですし…(((;゜д゜))
