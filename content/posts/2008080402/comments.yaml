    フィッシュ＆チップスばかり食べているのではないんですね。
    イギリス人は。
- id: 1372
  author: しおいり
  date: '2008-08-05 21:19'
  timezone: '+01:00'
  body: |-
    チップス（ポテトフライ）は好きみたいですね。中華に行ってもチップス食べてます。寿司屋にもチップス置いてあるかもしれません。（かっぱ寿司でもポテトフライ流れてたっけ）
    それよりも英国といえば紅茶の国と思っていたんですが、みんなインスタントコーヒー飲んでます。
