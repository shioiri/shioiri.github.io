<p>デュッセルドルフのオフィスへ顔を出したあと、スイス国境に程近いロットバイルへ。アウトバーンは想像と違い、日本と同じような普通の高速道路だった。お昼ごはんはパーキングエリアのバーガーキング。オフィスでビールをご馳走になり、ホテルでシャワーを浴びたあと夕食、のはずが、部屋へ入ってからの記憶がない。</p>
