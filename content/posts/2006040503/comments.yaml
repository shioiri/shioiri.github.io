- id: 449
  author: T. Tanaka
  date: '2006-04-06 15:30'
  timezone: '+09:00'
  body: |-
    スターフライヤーのHPを見ましたが，洗練されたビジネス感がありますね．
    「九州人だからとか，九州にある企業だから」というのとデザインは異なると
    思います．これは明らかにコーポレトアイデンティティ（CI），ビジュアルアイデンティティ（VI)が
    スターフライヤーの戦略に根付いているからだと思います．
    ですから，九州人がデザイン気質があるというのとは今回は関係ないように思います．
    ただ，イタリアのデザインはいいというのを聞くことがあると思いますが，
    これはイタリアにはデザイン気質があると言えると思います．
    街の隅々にもデザイン的な配慮がありますし，市民がデザインを専門的な特別な行為ではなく，
    非常に身近な行為として認知しているからだと思います．
