<p>散髪中に家から電話。前日に墓参で帰省していた妻の両親と弟が立ち寄るとのことで、急遽モンテリアで待ち合わせ。青龍の絶品餃子を披露したかったが宴会予約で席がなく、仕方なく華龍飯店。お腹の調子が戻ってきたので、行きたかったのだ。チャーハン１皿を大人５人でシェアしても食べきれず持ち帰り。</p>
