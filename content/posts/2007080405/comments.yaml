- id: 984
  author: リエ
  date: '2007-08-05 14:41'
  timezone: '+09:00'
  body: |-
    昨夜はお疲れ様でした。
    そして、妹とお邪魔させて頂きました。
    本来は私も出動する予定だったのですが、数日前からの腕の痛みで悪化させてはいけないと思い、急遽、お休みさせて頂きました。
    始めは、「高校の時、腱鞘炎や腕の痛みがあっても我慢すれば吹けていたから、これくらいなら大丈夫！」と思っていたのですが、一時期、シャーペンを持つのすら大変な状態になってしまったので・・。
    本当に申し訳ございませんでした。
    昨夜は妹が演奏を聞きたいとの事で連れていきました。
    どうやら、花市での演奏を楽しみにいていたみたいで、私が今年はやらない事を話したらかなり残念がっていて、「今日、演奏あるけど行く？」と聞いた所、「行きたい」との事で連れて行きました。
    実は、妹も中学時代、吹奏楽に入ってペットを吹いていたのですが、顧問が私の時と一緒で私の影響力があったせいか、顧問から余計なプレッシャーを与えられて以来、吹奏楽から縁を切っています。
    でも、私が音楽隊に入ってから意外にも、自分の予定が合う時には聴きに来てくれていて、実は悔いがあるのでは・・と、勝手に推理している姉であります（苦笑；）
    次のイベントには復帰できるように努力致します。
    ここ２週間フルート吹いていないので音が出るか心配ですが・・。（焦；）
    あっ＝３
    あと、うちの妹のご無礼お詫び致します。
