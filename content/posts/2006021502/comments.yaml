  timezone: '+09:00'
  body: |-
    ◇イタリア人は浮気よりも食べ過ぎに罪悪感
    ［ローマ　１０日　ロイター］　雑誌の調査によると、イタリア人の大半は、
    浮気よりも食べ過ぎに罪悪感を感じることが分かった。
    イタリアの雑誌「Riza Psicosomatica」が２５─５５歳の男女
    約１０００人を対象に実施した調査では、回答者がもっとも
    罪悪感を感じる行いは、「過食と無駄遣い」だった。
    雑誌が提示した７つの選択肢の中で、「不貞な行為」にもっとも
    罪悪感を感じるとの回答は最下位。「友人・家族を粗末に扱う」や
    「仕事で間違いを犯す」などの項目よりも低かった
- id: 413
  author: しおいり
  date: '2006-02-16 00:05'
  timezone: '+09:00'
  body: 昨夜、保科救護部長から「ダイエット中の昼食はおそばがいいよ」なんて聞いたもんだから、今日は社食でおそばを食べたんだけど、毎日取ってるお弁当をキャンセルしてなかったので、もったいないから「そば定食」にして両方食べちゃった。でもコロッケはもったいなかったけど我慢して残したよ。えらいでしょ。
