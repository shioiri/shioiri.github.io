- id: 1221
  author: いまちゃん
  date: '2008-02-25 21:25'
  timezone: '+09:00'
  body: |-
    はじめまして
    黒坂ホンダで検索して見つけました
    25年ほど前、大学の卒業論文のため、別所温泉南條旅館さんに1年程お世話になりました
    今堀と申します
    当時バイク（ＸＴ125）で付近の山の地質調査をしていました。
    帰りによく黒坂ホンダにお茶飲みに寄ってました。
    たまに、黒坂さんのお誘いで、長大のバイク好きの学生たちと保福寺峠にツーリングに行ったのを覚えています
    写真を拝見したところ、当時店でチョロチョロしていた坊主頭の子供さんじゃないかなと思いコメントした次第です。
    10数年程前に母が死ぬ前に私が大学時代お世話になった人に挨拶したいといって、黒坂ホンダにお伺いしたときには、ご夫婦でやっておられましたが、おとうさん引退されたのでしょうか？
- id: 1222
  author: しおいり
  date: '2008-02-25 21:59'
  timezone: '+09:00'
  body: |-
    こんばんは。コメントありがとうございます。
    確かに彼は次男坊。嫁さんがすごく美人です。
    おとうさんおかあさんも元気ですよ。きっと喜びますね。
    明日コメントのあったことを伝えておきます。
- id: 1223
  author: いまちゃん
  date: '2008-02-25 23:51'
  timezone: '+09:00'
  body: |-
    お返事ありがとうございます
    広島大学理学部地質出身の今堀です。
    修士時代も上田～上山田あたりに泊まって調査してましたので、黒坂ホンダには昭和60年～63年にわたってちょくちょくお伺いしてました
    広島から125ｃｃのバイクで通っていたので、黒坂さんには故障時やメンテでとてもお世話になりました。
    卒業してからもSR400で1回お伺いしたような気がします。
    バイクはほとんどＹＡＭＡＨＡでしたが、四輪はシビック～ライフとホンダばかり乗ってます。
    また機会があればお伺いしたいとお伝えください。
