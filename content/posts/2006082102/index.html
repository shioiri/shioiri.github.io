<p>早稲田の斎藤君、投げ勝ちましたねぇ。<br />

ホームランで一点差に詰め寄られたり、<br />

何から何まででき過ぎたシナリオ。すばらしい。<br />
ところで、とうりょうにコメントしてもらうまで、<br />
僕は「ハンカチ王子」を知りませんでした。<br />
ハンドタオルで汗を拭う高校球児…。<br />
確かに、いままでいなかったよねぇ。<br />
すばらしい。<br />
