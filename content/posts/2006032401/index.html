<p>1946年のアメリカ映画。<br />
初めて西部劇に手を出してみました。<br />
<a href="http://www.meiga-500.com/">この500円シリーズ</a>は、ハズレでも痛くないチープさが魅力なんだけど、<br />
買うだけ買って、見るのを忘れちゃったりすることも多々。<br />
この映画も、4ヶ月放置してありました。<br />
過激なアクション映画かと思ってたんだけど、<br />
どちらかといえば恋愛映画っぽかったです。</p>
