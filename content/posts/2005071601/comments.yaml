    今までダウンロードを躊躇してたんだけど、これはスゴいね！
    手のひらで地球転がして、気分は独裁者？！
    まさかとは思ったけど、背景のお星様もちゃんと本物なんだねぇ。
    そのうち大気圏突入（ズームイン）時に画面が赤くなるとか、入射角を間違えるとはじかれたり燃え尽きたりするようなプラグインが出たりして！
