<p>金山、尖閣湾のあと狙っていた古民家レストランが満席。ごく普通の食堂でヒレカツ定食。その後、トキ保護センターを見学したあと狙っていたお土産屋さんが、こちらはなんと閉店。何かとついてない一日。民宿の食事は、これまたズワイガニ。</p>
<p>ごちそうさまでした！</p>
