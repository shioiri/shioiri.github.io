  body: |-
    この時間になっても水や食事が届かない地区があるみたいですねぇ。一人お菓子１個と５００ｍｌのお水だけとはかわいそう。
    お腹がすくと精神的に苦しくなるでしょうから、早く炊き出しの用意ができるといいのですが。
