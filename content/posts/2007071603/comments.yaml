  author: リエ
  date: '2007-07-16 20:25'
  timezone: '+09:00'
  body: |-
    突然の地震、ビックリしましたね＝3
    自治センターの地震発生システムが発動して有線で情報が流れたですが、流れ終わった瞬間に揺れがきて、しかも二階に居たのでかなり恐かったです。
    外で農作業していた父も揺れに気付いた程でした。
    私は揺れの最中、ベッドの手摺りにしがみつきましたよ(≧□≦)
    台風はそれでも予想は出来ますが、地震は突然来るので怖いですね(＞_＜)
