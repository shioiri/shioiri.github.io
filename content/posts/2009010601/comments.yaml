  body: しおいりさん、こんにちは！ひょうきん族見てますね～ふふふ...えへへ...わはははっ、ああさんまちゃんのうつろ顔inパーデンネン。そんな格好してなぜうつろなのさんまちゃん。ひょうきん族とごっつええ感じ、これで私は死ぬまで笑って生きられます。
- id: 1446
  author: しおいり
  date: '2009-01-08 19:16'
  timezone: '+00:00'
  body: 見始めると止まらないですね。ありがとうございます。手元にあると反芻してしまいそうなので、集中して観たあと速やかにお返しするつもりです。やっと三本目。
