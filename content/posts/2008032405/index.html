---
title: できて当たり前、の怖さ。
time: '21:00'
timezone: '+09:00'
---
<p>日曜朝のご意見番が、今年の巨人は優勝して当たり前だと言っていました。<br />
大金はたいて、毎年のように「史上最大の補強」をしているのに、<br />
それがうまく機能しないチームを皮肉ってのことでしょう。<br />
勝って当たり前。<br />
負ければ選手もフロントも叩かれる…。<br />
そんなテレビを笑って見ていたのですが、<br />
我が身に置き換えて「できて当たり前」の怖さを感じました。<br />
一年間の語学研修。<br />
できて当たり前。<br />
ダメだったら…。<br />
もうやるしかないです。</p>
