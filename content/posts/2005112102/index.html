<p>昼食後、いつも会社の周りを散歩するのですが、遠くに見える白い山並みが槍ヶ岳なんだそうです。本当かな？と思って、Google Earth でその方角を見てみたら、どうやら間違いないようでした。矢印が槍ヶ岳の方向。その右にあるのが、目印となる青木の子檀嶺岳（こまゆみねだけ）です。<br />
