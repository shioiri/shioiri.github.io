<p>昨日の朝は平成最後の（出勤日の）月曜の朝で、今日は平成最後の（出勤日の）火曜。そして明日はなんと平成最後の水曜日。</p>
<p>朝は甘塩鮭、お昼は鯖の唐揚げ、夕飯は塩焼きそば。ごちそうさまでした！</p>
