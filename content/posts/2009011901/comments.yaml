    ２０週って長いんだか短いんだかいまいちわかりません。
    妊娠が全期間で４０週ですから・・・。
    （なーんて、この比較の方がよっぽどわかりづらいですよね。）
    全然関係ないんのですが、我が家の廊下の電気がつきにくくて仕方がありません。報酬はレイバーでのビールで、お時間のある時に見ていただけないでしょうか？
