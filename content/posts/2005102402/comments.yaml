    塩入様初めまして、ｍａｔｕと申します。どうかお見知りおき下さい。
    上田市中央２丁目の琴金堂楽器店にブラック師匠のＣＤが売られていますので、ＣＤでイメクラ五人廻しを聴けます。もちろん、ドラえもんプレイのシーンも収録されています。ご興味がございましたら、どうか見舞い金代わりと思ってこ購入下さい、よろしくお願いします。
