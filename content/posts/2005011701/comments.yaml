    ほ～ら。ねっ！
    おいらが勧めてたシューズだよ！
    ＭＢＴはっ！
    これで、Ｏ脚のカント（角度：膝がセンターから何度外にずれてるか）が左右同じになりました。
    だから、スキーのブーツはいたら、いやに真直ぐに立ってるなと感じたわけ。
    今度スキーに行く時はカンティングプレートのカント調整が必要になって、チョット細工しなきゃ。
    しおちゃん、早くＭＢＴ買って、ダイエットシナヨ。
