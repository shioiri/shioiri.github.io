<p>
<img src="https://ext.netlify.app/20130523-103501-1.jpg" alt="DSC01643.jpeg" /><br />
朝のフライトでトンボ帰り。灼熱のクリーブランドから、雨で肌寒いニューヨークへ。<br />
<img src="https://ext.netlify.app/20130523-103501-2.jpg" alt="IMG_1570.PNG" /><br />
空港近くの、お気に入りレストランで朝食。<br />
<img src="https://ext.netlify.app/20130523-103501-4.jpg" alt="DSC01646.jpeg" /><br />
クッキングサンデー。まずはカレー。<br />
<img src="https://ext.netlify.app/20130523-103501-3.jpg" alt="DSC01644.jpeg" /><br />
カレーソース在庫過剰。３年前に買って使ってないものもあった…。<br />
<img src="https://ext.netlify.app/20130523-103501-5.jpg" alt="DSC01647.jpeg" /><br />
できたてを、さっそくお昼ごはんで。でもまだ味が若い。<br />
<img src="https://ext.netlify.app/20130523-103501-6.jpg" alt="DSC01645.jpeg" /><br />
やさいスープ。これも冷凍保存。<br />
<img src="https://ext.netlify.app/20130523-103502-7.jpg" alt="DSC01650.jpeg" /><br />
美味だれも終わっちゃってたので、久しぶりに製作。ニンニク３か月漬けた。<br />
<img src="https://ext.netlify.app/20130523-103502-8.jpg" alt="DSC01651.jpeg" /><br />
晩御飯は塩糀チキン。</p>
