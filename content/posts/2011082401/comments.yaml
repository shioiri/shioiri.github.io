  date: '2011-08-24 10:35'
  timezone: '-04:00'
  body: |-
    やっぱり揺れたんですね。NYも。。。こうやって見ると広範囲に揺れたんですね。ワシントンが震源でNYも揺れてとニュースやってましたけど、ピンと来なくて。。。
    アメリカで地震なんて貴重な経験ですね。M5.1だったらしいですが、正直なところ、大きいかもしれないけど、、、日本では普通です。って感覚がおかしいですよね。
    地震は怖いです。
- id: 1807
  author: しおいり
  date: '2011-08-24 19:58'
  timezone: '-04:00'
  body: |-
    それが自分では地震だったという実感がなくて。
    シカゴでも一回あったんだけど、その時も判らなかった。
    4月7日夜、福島での震度5強も気付かず寝てたくらいだから、
    相当鈍感なんだろうねぇ。
