  body: 塩入知広様＞文章を拝読させて頂き、ご迷惑をお掛けしました。東洋ゲージ㈱という会社はポリゴン加工器具を製作しております。平成１８年２月末にこの会社は解散し、当社ＪＰＮ㈱が事業を引き継いでおり、このポリゴンカッタも当社商品として販売しております。詳しくは当社ホームページを御覧になってください。また必要あれば、製品パンフをお送りすることもできますので、当社精機事業部宛てご請求ください。
