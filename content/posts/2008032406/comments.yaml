    イーオンに通うんですね。
    僕はＮＯＶＡです。文法にこだわるとネイティブな表現が出来ません。
    あっ仕事で使うんだよね。俺とは意味が違う（笑）
    今、英文で日記を付けてます。過去形に置き換えて書くと文法が理解しやすくなりました。参考になるかどうか
    外国からメール頂戴ね。
