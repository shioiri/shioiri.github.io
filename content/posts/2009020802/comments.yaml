- id: 1480
  author: マコちん
  date: '2009-02-09 13:49'
  timezone: '+00:00'
  body: |-
    出張者のお迎えお疲れ様でした。
    出張者の方がいらっしゃるとどこでお食事をしますか？
    どこかおすすめのお店はありますか？
- id: 1481
  author: しおいり
  date: '2009-02-09 19:35'
  timezone: '+00:00'
  body: |-
    今回は地元じゃないので、昨日はホテルのラウンジ、
    今日は飛び込みで目に付いたパブ、そんな感じです。
    これが Brierley Hill だったら、
    メリーヒル北側の中華ビュッフェで好きなもの食べさせるか、
    Lye のウィンザーキャッスルあたり連れてくと思います。
    まだ二日目なんですが、既にフィッシュアンドチップス、
    バンガーアンドマッシュ、サンドイッチ、それにジャケットと、
    パブ定番は早くも紹介してしまいました。
    僕のレパートリーでは、残り Toad in the hole と
    キドニーパイくらいしかないのですが、
    彼らを二週間飽きさせないため、何かアイディアください。
- id: 1482
  author: マコちん
  date: '2009-02-10 08:37'
  timezone: '+00:00'
  body: |-
    Lye のウィンザーキャッスル？！
    きいたことないです。
    バルチですか？
    うちはいつもバルチはハリーズです。
    パブの王道、ローストはいかがですか？
    レイバーのラムローストは結構おいしいですよ。
    Lye のインドネシア（名前は Satay）はどうですか？
    結構おいしいですよ。
    バーミンガムまで足をのばせば、色んな秘境料理があるんですけどね。
    移民の街ですから。
    ケニアやエチオピア料理なんてめったに食べられないですよね？
    日本じゃ。
    あとは私は行ったことがないのですが、アフガニスタンとかあるらしいです。
    秘境隊の隊長はごんざれすさん。
    きいてみたらいかがでしょうか？
- id: 1483
  author: しおいり
  date: '2009-02-12 20:01'
  timezone: '+00:00'
  body: |-
    さすがB'ham、居ながらにして世界の料理を楽しめるわけスね。
    ウィンザーキャッスルはバルティじゃなくて普通のイングリッシュレストランです。
