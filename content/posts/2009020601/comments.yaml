    スウェーデンいいですよねー♪
    人は親切だし、街はきれいだし、大好きな国です。
    アーランダに降りるとそこは金色の絨毯が敷き詰められているようだった
    と言ったのは誰だったかな？群ようこ？
    ホント金髪（イギリス人とは違い本物の！）が多いですよね。
