    ふふふ…
    ねずみ橋の踏み切りの名前は…
    「古都久田踏切」と言います。
    一つ西上田方が「ねずみ第2踏切」（第1は廃止）
    一つテクノ坂城方が「百々目利踏切」（どどめき）といいます。。
    因みに…
    「飯山火葬場踏切」「ノコギリ屋踏切」「パーマ踏切」（長野県内）「中田原練兵場」（新潟県）など、
    面白い名前の踏切が有ります。
