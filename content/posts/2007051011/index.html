雨の中を駅まで歩き、急いでいるのに丁寧な説明をしてくれるお姉さんから切符買って、駅のおみやげ屋さんで生麩まんじゅう買って、発車ベルの鳴り響くホームに停車中ののぞみに駆け込み乗車。<br />
これに乗らないと長野の新幹線乗り継ぎが間に合わないのだ。<br />
我ながら素晴らしい乗り継ぎに感動中。</p>
