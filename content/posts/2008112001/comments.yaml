    Ｍ社の仕事がパッタリ無くなりました。
    バブル崩壊以来です。
    カナシス日本経済。
    失業者多発しています。
- id: 1415
  author: しおいり
  date: '2008-11-21 18:59'
  timezone: '+00:00'
  body: |-
    イギリスも15年続いた景気拡大がいよいよ悪化に転じたとあって、
    ラジオもテレビも連日金融崩壊、雇用不安の話題ばかりです。
    こちらに来てから会社をとりまく状況も激変しているはずですが、
    今は嵐の前の静けさなのかも、と少し不安ではあります。
