<p>しばらくカレー断ちを続けていたのだけど、ここのところ原料が順調なので、久しぶりの大盛りカレー。でもカレーホットが今日は出てなかったのが残念。</p>
<p>そしてお昼でお腹を膨らませてしまうと、夕飯もがっつり食べてしまいがちになるんだよねぇ、ということを久しぶりに実感。</p>
