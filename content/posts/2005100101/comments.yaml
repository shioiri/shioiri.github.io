- id: 296
  author: カオ
  date: '2005-10-01 13:46'
  timezone: '+09:00'
  body: |-
    はじめまして！
    コメント＆サイト紹介をしていただきましてありがとうございました。
    開始時間が早かったせいもあるとは思いますが、この会場広々としている上に開放感があっていいですねー！私はメキシコシティに住んでいるので中々地方の会場に行く機会（つまり時間とお金）がないんです。（泣）
    今では見慣れましたが、観客が普通にマスク被っているのって、かなりシュールな光景ですよね。試合のある日のメキシコシティの地下鉄内では、会場に行き帰りするファンが普通にマスク被って乗っているんですよ。日本でそんなことしたらヘンタイですよね！（笑）
    これからも、どーぞ拙ブログに遊びに来てくださいませ。ちなみに上記ほか2つのサイトの管理人さんたちも、みんな私のお友だちです。
- id: 297
  author: しおいり
  date: '2005-10-01 13:59'
  timezone: '+09:00'
  body: |-
    コメントありがとうございます。
    いやー、ほんと、とにかく、初のルチャ観戦はサイコーでした。
    この前の一戦は髪切りマッチだったんですが、そのレスラー、
    なんと奥に見える2階の踊り場からダイブしてましたよ。
    実は観戦前、街で売っていたマスクを躊躇して買ってこなかったんです。
    買わずに後悔するより、買って後悔すべし・・・。
    旅行先での買い物ではコレ、鉄則でしたよね（泣）。
