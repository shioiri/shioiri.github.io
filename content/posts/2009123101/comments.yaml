  body: |-
    いつも楽しい変装の年賀状をありがとうございます。
    楽しそうなことやってる割に、モデルさんたちがあまり楽しそうに見えないのは気のせいでしょうか。
    次回作は被写体全員が満面のスマイル！となるよう期待いたしております。
    なんてね
