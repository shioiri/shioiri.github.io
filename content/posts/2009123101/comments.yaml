  body: |-
    あけましておめでとうございます。
    シカゴ勤務ご苦労様です。シカゴへ行くチャンスはもう無いかも知れません。
    年賀状有難う御座います。我が家の今年の年賀状は、三男と私で、干支の寅に変装。年賀状データを添付したいのですがどの様にしたらよいですか？
    体に気をつけて頑張って下さい。
- id: 1694
