    どうもです。
    おかげさまで、今のところは何のトラブルもなく順調です。
    今は欧州の拠点があるドイツに滞在しており、次の水曜日にいよいよイギリスへ入ります。
    いろいろ西塩田情報を教えてくださいね。楽しみにしています。
