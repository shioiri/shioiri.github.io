<p><img src="https://ext.netlify.app/20121227-230003-16.jpg" alt="IMG_0375.jpeg" /><br />
コロラド州デンバーの朝。マイナス13℃。車内が暖房強めなので、この寒さでも心地よかった。<br />
<img src="https://ext.netlify.app/20121227-230003-15.jpg" alt="DSC00060.jpeg" /><br />
朝ごはんは中国人カップルと相席。かわいらしい奥様だった。<br />
<img src="https://ext.netlify.app/20121227-230003-14.jpg" alt="DSC00072.jpeg" /><br />
ひたすら雪の中を走り続ける。<br />
<img src="https://ext.netlify.app/20121227-230003-13.jpg" alt="DSC00087.jpeg" /><br />
お昼ごはんは中国人留学生と、その両親。中国語はけっこうちゃんと勉強したんだがなぁ、使ってないから完璧に忘れてた。<br />
<img src="https://ext.netlify.app/20121227-230003-12.jpg" alt="DSC00088.jpeg" /><br />
展望車で雪見アイス。<br />
<img src="https://ext.netlify.app/20121227-230003-11.jpg" alt="IMG_0390.jpeg" /><br />
<img src="https://ext.netlify.app/20121227-230003-10.jpg" alt="DSC00142.jpeg" /><br />
<img src="https://ext.netlify.app/20121227-230003-9.jpg" alt="DSC00144.jpeg" /><br />
<img src="https://ext.netlify.app/20121227-230003-8.jpg" alt="DSC00152.jpeg" /><br />
晩ごはんは、クリスマスを家族で過ごし帰宅中の老夫婦と。ずいぶんと日本びいきの方で、いろんな質問に答えるの楽しかった。</p>
