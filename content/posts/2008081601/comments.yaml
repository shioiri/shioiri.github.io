  body: |-
    会員制のクラブ＞秘密結社見たいなものでしょうか？？？
    そういえば、イギリスにはバイク屋さんとかバイク用品店とかあるのですか？
- id: 1382
  author: しおいり
  date: '2008-08-17 07:46'
  timezone: '+01:00'
  body: |-
    そうそう、秘密結社。ここのクラブはイギリス保守党支持者とスヌーカーゲーム愛好者が集まるところのようです。友だちに連れてこられないと入れないのがクラブ、誰でも入れるのがパブ（パブリック）ということですね。
    天気がコロコロ変わるので、日常の足としての二輪は人気がないようです。ただ、モータースポーツとしての二輪はとても盛んですね。用品屋さんも目につくところには存在しませんが、溜まり場のようなお店はきっとあるはずです。
