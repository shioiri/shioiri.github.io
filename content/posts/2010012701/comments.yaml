- id: 1709
  author: 山の上
  date: '2010-01-29 04:16'
  timezone: '-06:00'
  body: 山の上よりです。元気そうですね！日本時間は、１月２９日の午後７時を少し過ぎたところです。日本の鳩山首相も本日施政方針演説！誰か見ていたのだろうか？家に居るお年寄りぐらいかなー
- id: 1710
  author: sumo
  date: '2010-01-29 11:17'
  timezone: '-06:00'
  body: こんにちは、しおいりさん。イングランドのSUMO、実佐です。覚えていますか。お久しぶりです。しおいりさん、今シカゴなんですね。しおいりさんですから、きっとまたフットワーク軽く、楽しく、豊かな駐在生活を送られることと思います。お体に気をつけて、がんばってくださいね。こちらイングランドはウスターシャーの辺鄙な町より、応援しております^^
- id: 1711
  author: しおいり
  date: '2010-01-30 10:21'
  timezone: '-06:00'
  body: |-
    山の上さん
    こちらでは大統領の演説中にヤジを飛ばす議員もいませんし、野党側の主張も続けてテレビで放映されますので、日本のそれとは大違いですね。
    sumoさん！
    忘れっこないですよ、ひょうきん族の実佐さんじゃないですか。心身ともに豊かなイギリス生活が懐かしいです。ジャンクフードとクルマ社会…、この先が心配です…。
