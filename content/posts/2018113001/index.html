<p><img src="https://ext.netlify.app/img_1213.jpg" class="size-full wp-image-8514" height="2048" width="2048"><br />
うちのお味噌はいつもツルヤで買ってくるのだが、昨日から母が知り合いのお宅から頂いてきた自家製のお味噌。独特な風味とほのかな甘さで、お味噌汁がとてもおいしい。<br />
地域で味噌をこしらえるための大鍋やミンチ機が集会場に備品として残っていたが、増改築を機に処分してしまった。来年は味噌を作るイベントでも計画してみようかな。</p>
