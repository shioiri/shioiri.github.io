- id: 1708
  author: しおいり
  date: '2010-01-30 10:30'
  timezone: '-06:00'
  body: |-
    マヤさん
    予算の中で絞り込んだネットの情報ですでに一目惚れ。物件を実際に見て気に入り、即入居できない間に10軒ほど見て回ったのですが、予算内ではいちばん良かったので待ちました。築年数はけっこう経っているのですが、よく手入れされていて、ブリックの外観も気に入ってます。キッチンは本当に快適ですよ。ガスコンロも条件のひとつにしてあったのですが、ここはガス代も込みなので助かります。
