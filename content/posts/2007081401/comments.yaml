- id: 1009
  author: たむたむ
  date: '2007-08-21 14:45'
  timezone: '+09:00'
  body: |-
    中野丸井本店がなくなるのはさみしいですね。８月２６日１８：３０をもって閉店だそうです。
    私も丸井で育ちました。子供の頃から屋上で遊び、中学時代は１ゲーム１００円の日に仲間たちとボーリング。先日、最後にと思いボーリングをしてきました。
    桃三もなくなってしまうし、九中もあと数年とのこと。寂しいですね。
    秋の桃三小の合同同窓会でお会いできたらと思っております。
    申し遅れましたが、２年後輩の者です。姉がしおいりさんとクラスメートです。姉も同窓会に一緒に参加するかもしれません。
