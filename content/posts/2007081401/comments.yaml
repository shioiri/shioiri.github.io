    うちの何処かにまだあるハズ
    富士通のFM-8＆２４ドットPRT
    おいらもずいぶんお世話になったもんです。
    なつかしいなぁ～
    先日、片付けしてたら大学時代のFORTRANのパンチングカードがでてきた。卒業近くには77になり今のようにキーボードからプログラム入力できるようになったんだよね。
    化石時代の話でした。チャンチャン。
