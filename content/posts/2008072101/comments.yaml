- id: 1358
  author: 柘植圭司
  date: '2008-07-21 08:39'
  timezone: '+09:00'
  body: |-
    早々うに希望を叶えて頂き有難う御座います。日本にいながらイギリスの事を知る事が出来、これからも楽しみです。
    　今日は7月21日海の日でお休みです。朝から雲一つ無い晴天で汗だくです。昨日は、高校野球の決勝戦が行われ、東信の佐久長聖は後1本が出ず、２－３で松商学園に負けてしまいました。
    イギリスは野球よりサッカーですね。サッカー観戦の予定など有りますか?。次回を楽しみにしています。
- id: 1359
  author: しおいり
  date: '2008-07-22 03:01'
  timezone: '+09:00'
  body: |-
    サッカーは今シーズンオフですね。
    競馬は会社にビッグファンがいますので、
    そのうち連れて行ってもらえると思います。
