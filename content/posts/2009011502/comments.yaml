- id: 1452
  author: kayo
  date: '2009-01-15 21:55'
  timezone: '+00:00'
  body: |-
    お誕生日おめでとうございます。
    知人も今日４０歳の誕生日を迎えたとかで、胸に大きな「４０」の字のステッカーを貼っていました。
    明日のお誕生日のパーティは行けそうもありませんが、楽しい時間が過ごせますように。
    そして素晴らしい１年になりますように。
- id: 1453
  author: しおいり
  date: '2009-01-16 00:28'
  timezone: '+00:00'
  body: |-
    ありがとうございます。
    こんなふうに40の誕生日を迎えるなんて一年前は想像もしてなかったんですが、いい仲間に恵まれ、願わくばこのままここに居着いてしまいたい気持ちです。
