    しおちゃん、今年もよろしくね。
    １７日浜松ですか。泊り？
    泊りだったら少し足のばして浜名湖の弁天島にある「山本亭」に行ってごらん。
    「牡蠣」が旬で美味いんだこれが。
    HPありますんで休日の確認してね。
    お品書き必要ならFax.しますよ。では(^^)/~
- id: 391
  author: しおいり
  date: '2006-01-17 10:24'
  timezone: '+09:00'
  body: |-
    こちらこそ、よろしくです。
    浜松、たぶん日帰りですよ。
    浜松いつもエコノミーの宿、そこから徒歩でびっくりドンキーという一連の動作になってるから、あまり冒険したことないんですよ。ホテルとなりの居酒屋ではでっかいゴキブリに歓迎されたことあるし。それに、前に浜松で異様にマズいランチを食べたことあって、それ以来、浜松は食事がおいしくないイメージがあるんです。うな丼も、それなりのお店なのにごはんの炊き方が不満だったことあって･･･。次回は、ぜひ牡蠣を食べたいですね。前に入院したことあるのに、大好物なんです。
