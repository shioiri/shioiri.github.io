  body: |-
    信号無視はしらばっくれればいいらしいですよ。
    ポリ　「運転手さん、今のはちょっとマズいよね。自分でもお解りでしょ？」
    しお　「ハイ・・・。すみません。」
    何がマズいって言われてないのに、アッサリ認めてしまいアウト。
