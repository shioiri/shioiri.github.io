<p>1952年のアメリカ映画。歴史的コメディの第6作らしい。すでに定評あるシリーズに成長してからの作品であるため、大物俳優がチョイ役で登場。当時は最先端だったであろう特撮も楽しめます。でも500円シリーズにあるのは今のところこの作品だけ。他のを見てみたいなぁ。</p>
