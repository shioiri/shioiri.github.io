    英国の件：
    僕のblog書き込みありがとう。
    運転免許の件；国際免許ではなく、旅行ではなく一定期間住めば英国だけではなく
    ユーロ圏全ての運転免許を試験なしに申請料を支払えば発行されるはず（10数年前はそうだった）。
    しかも７０歳まで。調べてみて損はないです。
    以前、僕はその免許を持っていたが引っ越しで紛失した。何しろ、カードではなくA4の紙だったので。
