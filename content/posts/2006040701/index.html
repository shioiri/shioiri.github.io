羽田ー北九州のシャトル路線なので、同じ乗務員さんと顔を合わせることも珍しくないのかもしれません。<br />
でも、実際にそういう事態に遭遇するとびっくりします。<br />
「お忙しいのですね、お疲れさまでした。」<br />
ちょっとした一言が、とてもうれしかったです。<br />
もうひとつ驚いたのは、モデルみたいなイケメン乗務員。<br />
この彼、離陸前に放映される安全説明ビデオに登場してきます。<br />
まさか実物の乗務員だったとは。<br />
スターフライヤーでの初飛行は、実に思い出深いフライトになりました。</p>
