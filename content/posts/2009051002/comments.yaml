- id: 1542
  author: マコちん
  date: '2009-05-11 09:36'
  timezone: '+01:00'
  body: |-
    コンウィ良いですよね。
    あそこに行くと、フィッシュ＆チップスをどうしても食べてしまいます。
    まさかムール貝が有名とは！
    次回はそっちを試します。
    帰国前に、是非オススメしたいのが、スノードニア国立公園。
    特に、スノードンに登ってみてはいかがですか？
    登山電車で頂上まで行っても良し、途中、もしくは、麓から自力で登っても良し。
    （私は社員旅行で麓から登りました！）
    ガッツで日帰りもできますが、麓の湖のそばのB&Bに１泊もオススメですよ！
- id: 1543
  author: しおいり
  date: '2009-05-11 12:53'
  timezone: '+01:00'
  body: |-
    ムール貝の石像を見たのですが、なぜかシャッターに手が行かず…。
    宇都宮の餃子に通じるものを今になって感じ、
    写真に撮らなかったことをすごく後悔しています。
    それにしても！！登山鉄道！！これは行かなきゃ！！
    こうしてペンディングがどんどん増えていく。。。
