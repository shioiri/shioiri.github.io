  body: しおいりさん来年イギリスに来るんだ～！ティモシーはフードコート内の日本食屋（？）みたいな店で天ぷらと焼きそば食べましたよ～天ぷらはフリッターじゃなくてちゃんと天ぷらでした☆オープンの日にジェームズ・マーティンが来たので見に行ってきました～。おばちゃん（ティモシーも含め）が行列を作って彼を見に来てました（笑）ところで天まどって焼きそばですか？
- id: 1682
  author: しおいり
  date: '2009-12-02 00:19'
  timezone: '+09:00'
  body: |-
    焼きうどんです。ご覧のとおり最近調子に乗って、毎日食べてます。
    メリーヒルでも和食が食べられるようになったんですね。
