  body: |-
    くーちさん、はじめまして。コメントありがとうございます。
    英語がお得意なんですねー。尊敬しちゃいます。
    ボキャブラリーは増えないわ、間違った文法は直らないわで苦労してます。
    ところでこのRAGUというトマトソース、玉ねぎと焼きにんにくが入っていて、なかなか風味豊かです。イギリスは物価がとても高いので、少しでも食費を浮かそうとがんばってます。
