    こんにちは。ヨーク旅行に行ってらしたのですね。
    ヨークは私も大好きな町です。
    そうそう、日本小物のお店があるんですよね。（笑）
    ヨークミンスターは、イギリスの大聖堂のなかでも大きくて格も高い。
    大好きです。
