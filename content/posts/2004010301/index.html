<p>初泳ぎをしようと思ったが、なんと水着がない。キャップがない。ゴーグルもない。<br />
そこで、まぁ買っても高いものではないし、気分も新たに、新しいのを買おうと思いついた。<br />
メガマート。当然あるだろうと思って行ってはみたものの、残念ながら、店頭には並んでいなかった。<br />
だいたい、この時期、水着を買おうとしてるほうが間違っているだろう。<br />
しぶしぶ、あきらめて店を出た。<br />
でも、変なものだ。水着もないのに、水中メガネはこれでもか！というくらい大量に並んでた。</p>
