ホテルの朝ごはん<br />
<img src="https://ext.netlify.app/20130202-183001-3.jpg" alt="DSC00820.jpeg" /><br />
お昼はピザパーティー。すごく辛いピザだった。<br />
<img src="https://ext.netlify.app/20130202-183001-2.jpg" alt="DSC00821.jpeg" /><br />
晩ごはんは、奮発してステーキ。レアはさっぱりしてるからローカロな感じするけど、焼けば出てくる脂は含まれてるわけだよね。<br />
<img src="https://ext.netlify.app/20130202-183001-1.jpg" alt="DSC00822.jpeg" /><br />
酔っててもいつもちゃんとホテルの部屋間違えずに帰って来られるのすごいよな自分、と思いつつカードキーを取り出したらなぜか別のホテルチェーンのでビックリした。ホテル間違えたか？どこかでカード取り違えたか？混乱したが普通に鍵は開くというアメリカの適当さ加減すごい。<br />
今日の酒量：ワイン（シラー）２杯</p>
