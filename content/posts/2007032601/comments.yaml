    ポケベルがなくなってしまうんですね…。
    大ブームであった10年前と言えば、私は高校生でした。
    確かにクラスの殆どが持っていましたね。
    ポケベルだけで沢山の思い出がありますよ＝3
    授業中、ポケベルが鳴って先生達に問い詰められたり、親に文字の打ち方を伝授したり。
    また我が家ではプッシュフォン電話でもダイヤル回線だったので、文字を打つ前にダイヤル回線をプッシュフォン回線に直さなきゃいけなく大変だった事も。
    あとは、友達同士で文字の早打ち競争。
    私はかなり遅く、友達に「遅すぎっ」と言われた事も(^_^;)
    これも時代の流れなんですかね…(-.-;)
