<p><a href="https://cdn-ak.f.st-hatena.com/images/fotolife/s/shioiri/20190430/20190430221612.jpg" class="http-image"><img src="https://cdn-ak.f.st-hatena.com/images/fotolife/s/shioiri/20190430/20190430221612.jpg" class="http-image" alt="https://cdn-ak.f.st-hatena.com/images/fotolife/s/shioiri/20190430/20190430221612.jpg"></a></p>
<p>斉藤板金さんに手伝ってもらい、先代がこしらえてくれた裏の物置を処分した。僕が一人でやっていたら何日かかるかわからない仕事を、わずか数時間で終わらせることができた。</p>
<p>平成時代の終わり、年越しっぽくお刺身でも飼って食べようと思ってツルヤへ行ったら盛り込みが売り切れ。ビッグへ行ってみてもよけい品薄だったのでツルヤへ戻りアラカルトで購入。おいしいいちごとワインで気分は年越し。ごちそうさまでした。</p>
