  body: |-
    あそびに行くのでリサーチしといてね。
    季節はいつごろがいいかな？
    O氏は半袖で寒くないのかい？
- id: 1713
  author: しおいり
  date: '2010-02-01 20:09'
  timezone: '-06:00'
  body: 外は寒いけど、どこもお店の中は暖房がんがんなので、むしろ僕の格好のほうがおかしいのだ。快適だけど、この国のエネルギーの使いっぷりはほんとうに豪快ですよ。
