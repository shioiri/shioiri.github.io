  body: 隣のテーブルではうっかり駅カフェに入ってしまったオヤジさんがチューハイないのかとか今日のオススメは何かとか言ってますが、店員クンの爽やかな対応で場が和んでます。酔った相手に対しても変わらず一人の客として愛情を持って接する姿には学ぶものがあります。
