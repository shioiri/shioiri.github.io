- id: 401
  author: 中村　さきこ
  date: '2006-08-22 13:54'
  timezone: '+09:00'
  body: 「フルーク」昔、ビデオレンタルして観て、大好きになった映画です。好きで好きで、一年半前に飼い始めた愛犬にもフルークと名づけてしまいました。ずっと、「DVDは出ないのかなぁ・・・」と思っていたのですが、去年出ていたんですね！！！それを今日知って、必死で探しているのですが、限定生産のためもうどこにも売っていなくて・・・。しおいりさん、あまり気に入っていないようなので、もしよろしければ譲っていただけないでしょうか・・・。どうしても手元に置いておきたい作品なんです。ぜひお願いします。
- id: 402
  author: しおいり
  date: '2006-08-22 15:05'
  timezone: '+09:00'
  body: |-
    中村さんの大好きな映画だったのに、一回見ただけで酷評しちゃってゴメンナサイ。
    どーも死んだ元夫の言いがかりみたいなとこが納得できなくて…。
    僕はアマゾンで買ったのですが、今見たらマーケットプレイスで13,500円の値がつけられていてビックリしました。
    僕は取り扱いが雑で、盤面にキズが多くついていると思うんです。
    念のため、こちらで観ることができるかどうか確認した上、問題ないようなら差し上げますよ。
    （もう一度観ておきたいというのが本音だったりして！）
