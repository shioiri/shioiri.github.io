<p>1995年のアメリカ映画。事故で死んだ男が、犬に生まれ変わって家族との再会を果たす。普通に美談でまとまってれば良かったのに…。好き嫌いはあると思うけど、僕は「失敗したな」と感じてしまった一本。ワンちゃんの名演技は良かったけどね。</p>
