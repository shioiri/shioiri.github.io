- id: 1560
  author: しおいり
  date: '2009-05-27 18:18'
  timezone: '+01:00'
  body: |-
    やはり食いついてきたか。
    愛称「バルサ」って言うの？　それすら知らなかった。
    ホテルへ向かう地下鉄がサポーターだらけで、
    なんだこりゃと思ったらすぐ近くにスタジアムがあったのだ。
    もちろんスタジアムへは入れなかったけど、
    生の歓声が聞こえるパブで地元民と盛り上がってきたよ。
