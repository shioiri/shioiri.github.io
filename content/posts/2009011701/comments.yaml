- id: 1459
  author: 上田市消防団第一班
  date: '2009-01-18 12:29'
  timezone: '+00:00'
  body: |-
    お誕生日おめでとうございます（＾＾//
    アラフォーになったんですね。
    まだまだ、若いと思ってたのに・・・（笑）いやいや、イギリスでの益々のご活躍をお祈りしております。
    今日は上田市消防団の出初式があり、今まで騒いできました。
    恒例の富士アイスで石田君が冬にもかかわらず、冷やし中華大盛りを平らげてました。に、しても塩入さんの晴れ姿が見れなかったので残念です（T＿T)
    では、素敵なアラフォー世代をお楽しみください。
    すぐにさーまぁーさんが追いかけます（笑）
- id: 1460
  author: しおいり
  date: '2009-01-18 13:49'
  timezone: '+00:00'
  body: |-
    出初式に出なかったことはちょっと後悔してます。
    でも、任期満了で辞めたって感じじゃなかったからね。
    わざわざ帰国して並んだら浮いちゃってかもしれない。
    冨士アイスって冬でも冷やし中華が食べられるのかい。
- id: 1461
  author: マコちん
  date: '2009-01-18 18:47'
  timezone: '+00:00'
  body: |-
    わさび漬け等喜んでいただけてよかったです。
    今回はお嬢連れのバックパックでの帰国だったので、ちっちゃいバージョンのちびっこおすそ分けで申し訳ございません。決してケチっているわけではありませんのであしからず！
    日本で誕生日プレゼントにこんにゃく貰ったら驚くでしょうけど、こちらだとなかなか手に入らないので良いかなーと思いまして。。。
    本当に楽しいパーティーでした。ありがとうございました。
    昨日は人生で５度目の二日酔いでした。
- id: 1462
  author: しおいり
  date: '2009-01-19 07:23'
  timezone: '+00:00'
  body: |-
    マコちんさん、お心遣いいただきありがとうございます。
    プレゼントは、どれもばっちりツボにはまりました。
    ただ、「みりん」は使い方がわからない…ので、勉強します。
    二日酔いになるほど楽しんでいただき、僕もうれしいです。
