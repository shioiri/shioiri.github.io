    ワアーっ、懐かしいです。静岡出身・慶応ボーイの阿倍先生。
    お元気でなによりです。彼とフランス帰りの畝氏などとよく、全国のお祭りに行きましたよ・・・・・
    彼は飲めば女将によく着物を差し上げる癖がありましたが、いまは不景気そんな元気ないでしょう。
    そこも全盛期は多くおりましたが七割は亡くなっているでしょうね。
    ありがとうございました。
