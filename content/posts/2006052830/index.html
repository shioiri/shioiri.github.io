<p><img alt="1557.jpg" src="https://ext.netlify.app/1557.jpg" width="240" height="180" /><br />
宴会までの空き時間、上野公園前の階段で似顔絵を描いてもらいました。写真を撮ってくれているのは、第十五分団の坂田副分団長です。<br />
<img alt="1559.jpg" src="https://ext.netlify.app/1559.jpg" width="240" height="180" /><br />
何人かいた絵描きさんのうち、タッチが気に入ったこちらのおじさんにお願いしてみました。ライバルひしめく中、積極的な客引きを行っていないところも気に入りました。<br />
<img alt="1595.jpg" src="https://ext.netlify.app/1595.jpg" width="240" height="180" /><br />
どうです？すごく似てますよね。これで2,000円。<br />
似顔絵を描いてもらうなんて、30年以上ぶり。いい東京みやげができました。</p>
