- id: 1775
  author: Takamitsu Tanaka
  date: '2011-01-09 04:05'
  timezone: '-05:00'
  body: |-
    昨日、カレー専門店でカレーを食べました。
    美味しかったなぁ、本来はインド料理なはずなのに日本人の味にあうよね。
    留学時代、結局は日本のカレーのルーを取り寄せてよく食べてました。
    日本人は寿司よりカレーの方が好きなのかも。
- id: 1776
  author: しおいり
  date: '2011-01-10 00:18'
  timezone: '-05:00'
  body: |-
    マンハッタンにゴーゴーカレーという店があって、たいそう人気らしい。
    熱狂的な日本風カレーのファンがいるって前にどこかの記事で見た。
