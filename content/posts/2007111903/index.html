<p>昔は飛行機が苦手で、乗る前は緊張からいつもお腹をこわしたものだけど、空からの絶景に魅せられて、今ではすっかり飛行機好きになってます。<br />
どうせ乗るなら窓際をおさえておきたいところだけど、明日の鳥取便は搭乗率が高いようで、今のところいい席が確保できていません。キャンセルでぽっかりいい席が空くこともあるので、ネットで席の状況をチェックしながら仕事してます。<br />
