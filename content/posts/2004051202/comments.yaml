  body: |-
    今週のビックリドッキリメカ？
    ナツカシー！ヤッターマンぢゃないですか！
    いくらだろ？自分的には、モノつくりのプロを目指しているので、バラバラの状態だったら欲しいんだけど‥
    ですから、削りがないのでお見積はチョットネ‥
    でも、画像がきれいですね。ここのお店って、普通のお店？マニアックなお店？しかし、しおちゃん、よくだねぇ～。ますます、行動が？？？？
    家の近くの駄菓子屋さんに等身大の人形があります。
    鉄人２８号、デビルマン‥　　ケド、ドーしてもわからないのが１つあります。今度そのみせの近くに行ったらｌｏｇに画像投稿しますので、検討宜しく。
