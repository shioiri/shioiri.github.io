    ご無沙汰してます。
    せっかく帰ってきたと思ったら、今度はアメリカかあ。
    期限なしとは・・今度は何時逢えるんだろうね。
    寂しい限りです。
    しおちゃんのことだから、アメリカに行こうがどこに
    行こうが大丈夫だと思うけどね。
    いっそ、アメリカの金髪ギャルと結婚してみてはどうだ？
    いずれにしても体には気をつけてね。
    時々、このサイトは覗くようにします。
    検討を祈る！！
