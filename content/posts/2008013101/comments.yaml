  date: '2008-05-10 21:04'
  timezone: '+09:00'
  body: |-
    TZRつまみっぱなしですみません。
    DTはこないだレギュレータ交換をミスってしまい、
    折角のバルブを飛ばしてしまいました。
    バークシャーとかレディングとかぜんぜんわかりません。
    僕が行くのはバーミンガムの西、ダッドリーというところです。
    もう１０年早くに行きたかったです。
