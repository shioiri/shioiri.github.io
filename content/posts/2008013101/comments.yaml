  date: '2008-05-10 16:40'
  timezone: '+09:00'
  body: |-
    塩入さんへ
    ご無沙汰です。あなたもエゲレスに行ってしまうのね？
    ちなみに、私の姉家族は、バークシャーのレディングに住んでました。
    恥ずかしながら、自分も千曲高校卒の英語力で、カナダで生活しました。
    大丈夫ですよ。頑張ってください。
    もしよかったら、真田町在住のエゲレス人を紹介しますよ。
    でも、エゲレス英語ってちょっと違うよね。
- id: 1213
