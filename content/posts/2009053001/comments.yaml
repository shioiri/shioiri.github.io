    スーザン・ボイルさん優勝逃しちゃいましたね．．．残念
    個人的には女王様の前でパフォーマンスするならあの若者ダンスチームより、ボイルさんの方が良いと思ったんですが．．．
    でも彼女のあのホッとした様な笑みが可愛らしかった
    ところでしおいりさん、引継ぎの方が来ると帰国されてしまうそうですが、日にちとかもう決まってるんですか？　お帰りになる前にまたケイコちゃんと夕食にご招待したいです．．．ほんと寂しくなるなぁ｡･ﾟ･(ﾉε｀)･ﾟ･｡この際こっちで雇って貰いましょうよ．．．なんてｍ(｡≧Д≦｡)ｍｽﾏｰﾝ!!
