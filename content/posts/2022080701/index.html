<p>8:15、無量寺の鐘が鳴る。広島の原爆から77年。</p>



<p>明治期の制度設計ミスが太平洋戦争末期の悲惨な結果をもたらしたのだと、ある研究者。明治維新から終戦まで77年、その設計ミスを誰も修正することはできなかったのだ、と。なるほど。</p>
