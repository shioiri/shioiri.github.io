- id: 486
  author: riux
  date: '2008-07-07 21:58'
  timezone: '+09:00'
  body: |-
    塩入さん、はじめまして。riuxと申します。
    この記事から二年たったいま、学習効果はどうですか？
    まだ継続してらっしゃいますか？
    私は塩入さんよりちょっと年長ですが、いまさらながらpodcastで英語をモノにしようと思い立ち、各種podcastを手当たり次第にダウンロードしてみました。
    試聴した結果、eChat Vancouverに絞り込みました。
    理由は塩入さんとぴったり一致します。
    で、二年継続するとどうなるのか？意見を聴きたいところであります。
    よろしくおねがいします。
- id: 487
  author: しおいり
  date: '2008-07-08 02:17'
  timezone: '+09:00'
  body: |-
    riuxさん、はじめまして。
    eChatを聞き始めて、もうそんなになるんですね。
    仕事や通勤でクルマに乗ることが多かったので、運転中はずっとeChatを聞いてました。
    何度も繰り返し聞いたので、そりゃ頭に入りますよ。ゼッタイおすすめです。
    このたび英語の習得を兼ね、イギリスへ赴任することになりました。
    渡航前に２ヶ月間の駅前留学も経験しましたが、いちばん身になっているのはeChatと言って間違いないです。
    英語を聞き続けて、興味を持ち続けることができたのもeChatのおかげ。
    タグさんとユウコさんには本当に感謝です。
- id: 488
  author: riux
  date: '2008-07-08 08:57'
  timezone: '+09:00'
  body: |-
    うわ！イギリス生活ですか。頑張ってきてください。
    eChatの太鼓判を押していただいたので、心置きなく取り組むことにします。
    ユウコさんはなかなかの名講師ですね。
    三日坊主にならないように私も頑張ります。ありがとうございました。
    しおいりさん、実りあるイギリス生活を！
- id: 489
  author: しおいり
  date: '2008-07-22 03:18'
  timezone: '+09:00'
  body: 到着してから何かといっぱいいっぱいでiPodを使うこともなかったのですが、久しぶりに聞いてみたらやっぱりeChat、いいですね。eChatに限らず、Podcastの出現で外語学習がとても便利になったと思います。いい時代になったものです。
