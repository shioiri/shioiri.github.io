- id: 252
  author: チャオ
  date: '2005-08-20 00:40'
  timezone: '+09:00'
  body: 実は、ＴＵＮＡＭＩバンドが未だに届かないんです・・・どうして？？？
- id: 253
  author: しおいり
  date: '2005-08-20 10:47'
  timezone: '+09:00'
  body: |-
    むむむ、ちょっと遅いですね。
    パープルバンドとブルーバンド、同じ日に注文して、同じ日に届きましたよ。
    注文の控えを確認し、間違いなければ勇気を出してクレームつけましょう！
- id: 254
  author: あやか
  date: '2005-08-23 15:50'
  timezone: '+09:00'
  body: |-
    初めまして！
    唐突で、とてもあつかましいお願いなのですが、パープルバンドを１～２個譲っていただけないでしょうか？もしくはクレジットカードがなくても購入できるところ、サイトなどご存知ないでしょうか？
    私も友達もパープルバンドがとても欲しいのですが学生の為クレジットカードなどを持っていないので海外サイトで買えないんです…
- id: 255
  author: しおいり
  date: '2005-08-23 16:28'
  timezone: '+09:00'
  body: まだ2個残ってますよ。よろしければ左上のプロフィールにあるメアドまでご連絡を。さて、何と交換しましょうか？　なんてね。差し上げますよ。
- id: 256
  author: あやか
  date: '2005-08-23 17:53'
  timezone: '+09:00'
  body: |-
    ありがとうございます！
    先程プロフィールにあるアドレス宛にメールを送らせていただきました。
    お手数ですが、お返事頂けると幸いです。
- id: 257
  author: pekepeke
  date: '2005-09-02 17:55'
  timezone: '+09:00'
  body: |-
    始めまして！
    私もパープルバンドを探してここにたどり着きました。
    まさかですがもう残っていないですよね・・・？
    １本でいいのですが・・・ありませんか？
- id: 258
  author: しおいり
  date: '2005-09-02 18:10'
  timezone: '+09:00'
  body: |-
    お問合せありがとうございます！
    これ、けっこう人気なんですねぇ。
    購入方法をメールで質問されてこられた方もいらっしゃいましたよ。
    家族や友達に配っちゃいましたから、
    あとは、いま僕がつけてるやつだけです。。。
    せっかくお問合せいただいたのに、残念でしたね。
    オークションサイトにけっこう出てるみたいですけど、
    なんか高値で売られてて複雑な気持ちです。
- id: 259
  author: 彩香
  date: '2005-09-02 22:01'
  timezone: '+09:00'
  body: |-
    こんばんは。
    今日パープルバンドが届きました！
    本当に感謝しております。
    ありがとうございました。
    オークションで高値で売る人の気持ちが私にはわかりません…。
    利益をあげようとしているなんて…なんだかがっかりです。
- id: 260
  author: pekepeke
  date: '2005-09-03 08:41'
  timezone: '+09:00'
  body: |-
    そうなんですよ。
    オークションで高値で買うのはちょっと･･･意味が違うんじゃないかと。
    かといって海外通販ちょっと不安･･･。
    でも何とか仲間を集めて英語に挑戦してみます。
