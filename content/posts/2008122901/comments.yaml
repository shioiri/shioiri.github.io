- id: 1436
  author: たかみつ
  date: '2008-12-31 07:23'
  timezone: '+00:00'
  body: |-
    良いお年を。人生最高の時間、英国を満喫しましょう！！
    チャーリングクロスからナショナルギャラリーのメインホールから入り、ダビンチやレンブラントの作品を
    見ながら、レスタースクエア側の出口にでてみてください。
    無料で人類の最高レベルの
    美術作品をみながらの恐らく世界で一番リッチなお散歩ができるはずです。
    時間があればその隣にあるポートレートギャラリーもお勧め、これも無料だったと思うよ。
    そして、その後にチャイナタウンで食事をする。これもロンドンの醍醐味の一つです。
- id: 1437
  author: しおいり
  date: '2008-12-31 16:53'
  timezone: '+00:00'
  body: |-
    ほんとうに贅沢な時間を過ごさせてもらってます。
    この機会を無駄にしないよう、2009年もいろいろ見て回るつもりです。
