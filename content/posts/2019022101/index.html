<p><img src="https://ext.netlify.app/img_4962.jpg" class="size-full wp-image-8622" width="2048" height="2048"><br />
月に一度、無尽のときだけはお酒を頂こうと思い臨んではみたけど、もうだいぶ弱くなってしまいダメだ。あんなに好きだったお酒が苦手になってしまった。<br />
無風で無投票が予想されていた県議選に若い人が立ってくれた。我が無尽が推している候補も慌てて体制を整え迎え撃つことに。でも内心は若い人も応援したい。保守でうまく分け合うことができたらいちばんいいんだけど。</p>
