<p>月明かりの中、渓谷を縫うように列車は進んでいきました。写真には写せない、幻想的な景色。<br />
<img src="https://ext.netlify.app/20121227-230003-7.jpg" alt="DSC00155.jpeg" /><br />
朝ごはんは親子連れ。７歳の子は、僕がぜんぜん知らない日本のマンガのキャラクターの名前をいろいろ教えてくれた。<br />
<img src="https://ext.netlify.app/20121227-230003-6.jpg" alt="DSC00162.jpeg" /><br />
<img src="https://ext.netlify.app/20121227-230003-5.jpg" alt="DSC00163.jpeg" /><br />

<img src="https://ext.netlify.app/20121227-230003-3.jpg" alt="DSC00170.jpeg" /><br />
食事中、雪で電車が止まってしまった。３時間遅れ。<br />
<img src="https://ext.netlify.app/20121227-230003-2.jpg" alt="DSC00185.jpeg" /><br />
<img src="https://ext.netlify.app/20121227-230003-1.jpg" alt="DSC00186.jpeg" /><br />
途中、飛ばし過ぎのオーバーヒートで機関車が止まってしまうというハプニングもあったが、終点エメリビルには２時間遅れで到着。</p>
