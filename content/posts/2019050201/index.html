<p>家族で佐渡へ。</p>
<p>朝食はコメダ珈琲店。お昼は富寿し直江津店。フェリーで佐渡へ渡り、赤泊のサンライズ城が浜で一泊。プレバトを見ながらズワイガニの身を穿る。</p>
<p>ごちそうさまでした！</p>
