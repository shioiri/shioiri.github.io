<p>僕の職場にいる「荻サン」（センター長じゃなくて晴夫ちゃんのほう）は、ちょっとヘンです。<br />
おなかの調子が悪いと、正露丸を飲んでニオイをプンプンさせてるのに、さっきペットボトルに入っている濁った水（しかも有機性不純物が浮遊してる）をゴクゴク飲んでました。<br />
何でも、１ヶ月くらい前に採ってきた和田の<a href="http://www.google.co.jp/search?q=%E9%BB%92%E6%9B%9C%E3%81%AE%E6%B0%B4&hl=ja&ie=UTF-8">黒曜の水</a>だというのですが、課長に指摘されて、あわてて捨ててました。でも手遅れです。</p>
