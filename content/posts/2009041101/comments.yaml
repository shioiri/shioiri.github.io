    信州は暑い日が続いてます。
    イギリスではこの時期は天候はどうなんでしょう。
- id: 1521
  author: しおいり
  date: '2009-04-12 16:41'
  timezone: '+01:00'
  body: |-
    おぉ、KIPSさんお久しぶり。
    今日は規律訓練、あと総会だったのではなかろうか。お疲れさまです。
    こちらは暑くもなく寒くもなく、ほんとうに過ごしやすいです。
    雨もこの頃はそれほど多くはなく、降っても雨宿りすればすぐにあがって
    虹を見ながら歩けますから、傘は持ち歩かなくても大丈夫です。
    桜はそちらより１週間ほど早かったですね。
