すごい人出でびっくりしました。<br />
連休と重なって、家族連れのお客様も多くお見えでしたけど、<br />
お昼前のピークで未登録の入場待ちは2時間を超えていたそうです。<br />
ゲートの内側レストランへ直接出入りできる裏道があるんですけどね。<br />
西館はアメ横状態。歩くのすらままなりません。<br />
道幅の広い東館も、ブース内へ足を踏み入れたら身動きとれません。<br />
業界全体に好調な中での見本市、<br />
機械からの発熱と人々の熱気で、ものすごい蒸し暑さでした。<br />
