  body: |-
    無事に現地の生活に慣れてきているようだね。
    どうして海外に？っていう経緯を知らないんだけど（苦笑）、気を付けて頑張ってね！
    私も来月に数週間トルコに仕事に行きます。
    ちょっとお互いの距離が近づきますね（笑）♪
- id: 1350
  author: しおいり
  date: '2008-07-18 02:31'
  timezone: '+09:00'
  body: 英語の勉強を兼ね、イギリスの販売法人に一年間の期限付き赴任です。今のところ何の違和感もなく楽しんでますけど、英語をマスターできずに帰国できないな、というプレッシャーと戦うことになりそうです。
- id: 1351
  author: なちょり
  date: '2008-07-18 10:11'
  timezone: '+09:00'
  body: |-
    そうなんだぁ～～～！！！
    すまん。。。ブログあんまちぇっくしてなかった。。。。
    1年間でかなり上達すると思うよ～！
    ボキャブラリーはそれなり学習しなくちゃいけないし、また仕事で使う英語、業界や分野によって使用する言葉などもあると思うので大変ではあるけど、しおいり君ならできます！！！！
    こんなこと出来るかわからんけど、現地にコミュニティー大学みたいのないの？？イギリスはよくわからないけど、アメリカだと社会人用に夜のクラスあって、生徒じゃなくてもVisitorとしてクラスに参加出来たりするとこもあるんだよね。
    それと時間と余裕あれば何か習い事をするのも良いかと！私も今でも連絡取り合ってるのは現地で同じ習い事してた連中なので。
    とにかく健康、その他気を付けてね！
