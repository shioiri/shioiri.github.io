    おひさです。
    お元気そうでなにより。
    ところで、英国といえば、”Ｔｅａ”　　紅茶はどんな感じ？
    もう少し暑くなってきたら個人的には”アール・グレイ：ＥＡＲＬ　ＧＲＥＹ”がオススメなんですけど‥
    あと、トラのヴィンテージをみつくろって送っといて（笑）
