    今日は、古地図専門の資料館成るもの個人で立ち上げまして、頑張っています。
    全日本全図.全世界全図.鳥瞰図．教科書江戸時代から昭和20年頃まで.
    道中案内図.観光案内図．絵葉書．写真帖.等色んな資料成るものかき集めています。
