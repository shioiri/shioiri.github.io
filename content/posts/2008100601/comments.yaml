- id: 1405
  author: たかみつ
  date: '2008-10-08 12:25'
  timezone: '+01:00'
  body: |-
    充実した日々と刺激で何よりです。
    僕もまたイタリアに行きたい、楽しんでねん。
- id: 1406
  author: しおいり
  date: '2008-10-08 22:21'
  timezone: '+01:00'
  body: |-
    イタリアの建築は荘厳でした。
    歴史や宗教をもう少し勉強して、もう一度訪れたいです。
    また、イギリスの居心地の良さを実感した旅でもありました。
