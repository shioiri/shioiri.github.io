  body: |-
    清水副部長に、広島からこういうお酒が届いたよ、って教えてあげたら、すごく驚いてました。
    ずいぶん高価な品物なんですね。
    ふだん晩酌などしないので、消防の詰所へ持っていこうと思ったんですが、カナリ貴重な品らしいので、大事にしておこうと思います。
