- id: 1563
  author: spacesis
  date: '2009-06-01 18:20'
  timezone: '+01:00'
  body: |-
    初めまして。
    ポルトのspacesisです。
    コメントのレスが大変遅くなり、ごめんなさい。
    この１週間ほど風邪で寝込んでおりました＾＾；
    ポルトの情報、いくらかでもお役に立ててたら嬉しいです。
    見慣れた景色の写真、ポルトはどこを撮っても絵になる
    ような気がします。
    ところで、上の方同様、スパゲティの３食メニューには
    わたしも笑ってしまいました＾＾
    朝メニューおもちに餡子ですか？あれは、なかなか
    いいですね。おもちが入手できるのは羨ましい限りです。
    ポルトでは日本食入手はかなり難しい＾＾；
    体調崩すととたんに日本食が欲しくなるのですが、
    その点、イギリスはたくさんありますね＾＾
    ビザ終了まで後1ヶ月弱とのこと、お体に気をつけて
    よい滞在になりますように！
- id: 1564
  author: しおいり
  date: '2009-06-01 23:09'
  timezone: '+01:00'
  body: |-
    spacesisさん、ようこそいらっしゃいました。
    お風邪、大丈夫ですかぁ？
    お餅は正月にロンドンで買ったものがまだ残っていたのです。
    日々の食事も、調理のレパートリーと想像力に乏しいため
    どうしても同じ物が続けてしまうんですよね。
