<p><img src="https://ext.netlify.app/20121212-090502-4.jpg" alt="image.jpeg" /><br />
昨日の朝ごはん。<br />
<img src="https://ext.netlify.app/20121212-090502-3.jpg" alt="image.jpeg" /><br />
お昼ごはん。<br />
すごい霧のため空港で半日待ちぼうけ。欠航の代替便はシカゴ経由。夕食はビールを一杯、機内でワインを二杯。ホテルに着いたのは夜中２時過ぎであった。<br />
<img src="https://ext.netlify.app/20121212-090502-2.jpg" alt="image.jpeg" /><br />
今朝のご飯。<br />
読者の方から結構食べてるね、体重＆健康維持やめたんだね、と言われグサリグサリ。ご心配をおかけしてすみません。ご覧のとおり、昨日から節制してます。<br />
<img src="https://ext.netlify.app/20121212-090502-1.jpg" alt="image.jpeg" /><br />
お昼ごはん。<br />
晩ごはんは抜いておきます。ここ数日で久しぶりの空腹感が心地良い。</p>
