  timezone: '+00:00'
  body: |-
    メリー・クリスマス
    ご無沙汰をしております。
    おいしそうなサンドイッチをいつもよだれを垂らしそうになりながら拝見しております。
    英国もこの時期は寒いのでしょうね。風邪などひかぬよう過ごしていただけたら幸いです。
    素敵なクリスマスを、新しい年を迎えてくださいね
- id: 1433
  author: しおいり
  date: '2008-12-26 09:36'
  timezone: '+00:00'
  body: |-
    どもども、
    イギリスはサハリンよりも北にあるけど、思ったほど寒くはないですよ。
    上田よりは楽だと思います。
    毎日食事を記録することで、無事に生きてることをお伝えしております。
    予告なく更新が止まったら、何かあったと思って会社へ連絡してください。
