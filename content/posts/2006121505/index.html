<p>1946年のアメリカ映画。<br />
自分の夢はいつも二の次で、思いどおりの人生を歩んでこれなかった主人公。それでも、そこそこ幸せな生活を送っていたのですが、楽しいはずのクリスマスが一転、事件が起こってしまいます。<br />
命の大切さ、謙虚な心の美しさ、お金の怖さ、いろいろ考えさせられる映画でした。不器用でバカ正直なジョージの気持ち、僕はすごく理解できます。</p>
