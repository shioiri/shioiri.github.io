    手塚は母方の実家で、皆が元気な頃は盆と正月遊びに行っていました。金魚すくいをやるとの事で公民館に集まり、長々と待たされやっと出来たのが1番の思い出です。最近はあなたのご投稿で、西沢商店さんの松茸ごはんを買いに、西沢さんがご健在なのも嬉しかった。昔は花火しか買った覚えが無かった(^_^;)

    Twitterハンドルネーム　kakkaより。
