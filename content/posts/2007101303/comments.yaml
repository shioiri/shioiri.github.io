  body: |-
    しおちゃん、着々と進んでますね。
    タンクの錆落しには「花咲かじい？」だったかな？が結構強力に落ちます。チョットお高いですけど。
    ４０？過ぎからライダーには無限電光株式会社の「hit air」がオススメです。二輪用のエアバックジャケットです。（名古屋の会社）
    http://hit-air.com/
    ２５年以上のキャリアの同級生ライダーが今年、２人も事故ってます。幸い大事には至らなかったですが、やはり装備はそれなりのものをしてたからかな？
- id: 1071
  author: しおいり
  date: '2007-10-17 10:23'
  timezone: '+09:00'
  body: 最近は著名なライダーの事故も続いたりして、二輪て怖いもんだな、とつくづく思いますね。まったくの初心者なので、基本を教わりながらトコトコ乗ろうと思ってます。
