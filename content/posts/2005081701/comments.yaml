- id: 248
  author: はる
  date: '2005-11-09 10:46'
  timezone: '+09:00'
  body: 彼等の言葉尻を借りるなら、有名人がCMで指を鳴らしている間も、東京タワーを白くしてる間も、選挙投票日前日に大規模なデモ行進をしてる間にも、、それらにかかった費用は、アフリカではなく、中国、広告代理店、流通業者、怪しげなNGO団体に流れて行くだけでアフリカの子供達は１人も助かること無く、相変わらず３秒に１人死んでいる。
- id: 249
  author: はる
  date: '2005-11-09 10:54'
  timezone: '+09:00'
  body: |-
    ホワイトバンドを買っても、アフリカには1円も行かないってことを知らない人が多いみたいだよね。いまだにホワイトバンド買いましょうみたいなことを書いているページが減らないので開いた口がふさがらない。
    アフリカの貧困を救済することは立派なことだけれども、ホワイトバンドを買うことでどれだけ貧困救済に貢献できるのか、そんなことも自分で調べないで流行に踊らされてるだけのように見えるんだよね。
