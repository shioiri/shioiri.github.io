    確かに、ウェブサイトには初めから募金ではないことがうたわれていて、こういうものを身に付けることで問題を顕在化させようという意図には僕も賛同していたつもり。最初からシナリオどおりで、100パーセント商売だったということなら、僕も踊らされちゃった者の一人ということですなー。
    とりあえず、バナー引っ込めるとするか。
- id: 251
  author: はる
  date: '2005-11-10 09:56'
  timezone: '+09:00'
  body: |-
    ホワイトバンドの活動の目的は、日本のアフリカに対する貸付金（円借款）をチャラにするよう政治的に働きかける、ってことなんですよね。
    貸付金をチャラにする、ってことは日本の負担が増えるってことで、財源はどうするのかといえば、増税しかないでしょう。
    稼いだお金はナントカという企業と中国の業者が良い思いをし、実際の行動は政治家がやれと。その費用の負担は（稼いだ金ではなく）国民の税金を当てろと。で、ようやく稼いだ金の3%を寄付する気になったらしい。
    貸付金が問題だというなら、稼いだ10億円をポンとアフリカに送っちゃえば良いのに、あくまでも自分達のために使うらしい。
