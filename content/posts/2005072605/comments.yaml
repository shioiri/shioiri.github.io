- id: 231
  author: どびんちょ
  date: '2005-08-05 17:31'
  timezone: '+09:00'
  body: |-
    *** 私のホワイトバンドは洗えます! ***
    こんにちは。
    わたしの着けているホワイトバンドは布地で、
    「FAIR TRADE NOW」というメッセージの入っているものです。
    マジックテープで長さ調整もできますよ。
    これは、自由が丘にある
    「People Tree／http://www.globalvillage.or.jp/」
    というお店に売っています。
    また、「もうちょっと自分に何かできないかな？」
    という気持ちを持っている方、
    1日50円ずつ寄付する支援というのもありますよ。
    →http://www.msf.or.jp/index.php
    この国際団体は、ノーベル平和賞を受賞したこともある、
    世界的に活躍している組織で、今まさにアフリカをはじめ、
    貧困に苦しむ国の人達に食糧や医療の支援活動をしています。
    50円で、数人分のワクチンや食糧を得ることができるのだそうです。
    わずか50円で・・。
    私もこれを続けているのですが、
    3カ月に一度の引き落としを確認するたび、
    アフリカをはじめとした貧困のことを考えます。
    これからも可能な限り続けたいと思っています。
