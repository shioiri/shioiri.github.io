<p>職場に回覧されてきました。<br />
　　真剣だと知恵が出る<br />

　　いいかげんだと言い訳ばかり</p>
<!--more-->

<p>なんか聞いたことあるなーと思って調べてみたら、川上哲治氏の言葉だったようです。<br />

でも、実際こんなだと疲れちゃいそうですね。<br />
　　真剣だから愚痴が出る<br />

怒られますかね。</p>
