  body: |-
    しおちゃん。体重と体脂肪率高いねぇ。
    ５月末にｍｂｔという靴買いました。いつも履いているわけではないですが、６月に９３ｋｇの体重が今は８５ｋｇ前後で、体脂肪率２０％です。この靴、一石何丁もあり、オススメです。日本代理店はhttp://www.mbt-evernew.com/  です。おいらが買った店は名古屋にありますが、http://www.spo-heim.co.jp/  です。この中の、「トピックス＆ニュース」の「耳寄り情報」の2004/05/21の究極の‥に詳しいコメントあります。参考までに。一足25000円です。（スポーツタイプ）
    これからは、もっと自己管理が問われてくるでしょう。呑みすぎには注意だよ。
    じゃぁねぇ～！
