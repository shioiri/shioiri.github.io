    よく見たら、この体重はありえない！たぶんメモを間違ったんだと思います。
    体脂肪率を僕は体重計で測っているのですが、お風呂上りと朝とではぜんぜん違うんですよね。
    朝のほうが、お風呂上りよりも5ポイントほど高く表示されるようです。
