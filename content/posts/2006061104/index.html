<p>1998年のアメリカ映画。<br />
生きる望みを失いかけ、任意入院した精神病院での体験から医師をめざすようになり、誰よりも患者のために尽くす天才医学生の物語。病院の体制に反抗し、やりたい放題やったがために退学の憂き目に遭うも、医師をめざす強い意志を貫き通していく主人公。実話だそうです。よく泣けました。</p>
