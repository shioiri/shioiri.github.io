  date: '2009-01-22 09:11'
  timezone: '+00:00'
  body: |-
    本当に活動的でフレンドリーなしおいりさん、頭が下がります。
    音楽活動をされているのですね。
    楽器は何ですか？
    発表会があるなら是非ご連絡下さい。
- id: 1468
  author: しおいり
  date: '2009-01-22 14:28'
  timezone: '+00:00'
  body: |-
    日本の消防団音楽隊に20年いました。打楽器を扱います。
    渡英を言い訳に退団してきたので、まさかイギリスに来てまで
    消防音楽隊やるとは夢にも考えてませんでしたけどね。
    やっぱり楽しいです。
- id: 1469
  author: 山の上
  date: '2009-01-23 08:32'
  timezone: '+00:00'
  body: 日本では、出初式も終り分団は水利調査会にむけ進んでいます。当年からまた、消防委員の任に就きました。そちらの音楽隊は、どんな感じですか？楽しんでいるようで、なによりです。ただ今の日時は、２３日午後５時３２分です。
- id: 1470
  author: しおいり
  date: '2009-01-23 20:58'
  timezone: '+00:00'
  body: |-
    どんな感じ？
    ひとことで言えば、まったく同じです。
    あ、決定的な違いが…
    練習途中にティータイムがあります！
