<img src="http://f.hatena.ne.jp/images/fotolife/s/shioiri/20080724/20080724120625.jpg"><br />

<img src="http://f.hatena.ne.jp/images/fotolife/s/shioiri/20080725/20080725214943.jpg"><br />

サイダーも買いたいと思っていたので、ちょうどよかった。<br />
<img src="http://f.hatena.ne.jp/images/fotolife/s/shioiri/20080725/20080725214843.jpg"><br />
