<p><a href="http://blog.livedoor.jp/puchi7892/">☆あさもや探検隊☆</a> - 大洲まちの駅「あさもや」探検隊長イリちゃんのブログ<br />
昨夜の笑ってコラえて「日本列島観光課長の旅」は愛媛県大洲市。何度か行ってますが、お客さんの工場と目の前のビジネスホテルを往復するだけで、出歩いたとしても近くのAコープ、あとオズの湯というスーパー銭湯くらいしか行ったことがなかったので、とても興味深かったです。<br />
その途中で、大洲まちの駅「あさもや」が紹介されていたのですが、地図で見たら川を挟んだ反対側、山の向こうに中心街があったんですね。</p>
