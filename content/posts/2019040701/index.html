<p>お昼はサイゼリヤ。イオンでワイシャツとネクタイを購入。著名なソムリエに立たせ真っ昼間からワインの試飲を勧めてきたり、フランスベッド特設コーナー最大の売りが「送料・設置1080円」だったりと、何だかイオンは迷走している感じだった。</p>
<p>その後ケーズデンキにて、初めて妻を車椅子に乗せて店内を物色。目当てのAirは並んでいなかった。</p>
