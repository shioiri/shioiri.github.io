<p>1939年のアメリカ映画。<br />
買ったきり塩漬けにしてあったのですが、これが驚き、古臭さをちっとも感じない、すばらしい映画でした。背景の奥行き感、登場するキャラクターの表情、美しい色使い、どれをとっても、当時の技術力の高さには驚かずにいられません。当たり外れの大きい格安DVDの中にあって、これは文句なしの当たりだと思います。</p>
