- id: 546
  author: しお
  date: '2006-07-31 11:25'
  timezone: '+09:00'
  body: |-
    ご声援ありがとうございました。
    去年が5位、今年が4位。まだまだ、上田は挑戦者の立場です。
    でも上田の県大会メンバーは、毎年メンバーを替え、多くの隊員がその練習に参加することで、全体の底上げを図っているわけですよね。
    いつまでも優勝できないということで、正副ラッパ長のプレッシャーは相当なものだと思うんですが、僕は今のやり方でもいいんじゃないかなーと思ってます。
