  body: |-
    参加者のみなさん、申し訳なかったです。
    飲み放題を注文しておいたつもりだったんですが、お店の方にうまく伝わっていなかったみたい。
    そういえば飲み放題メニューは出てなかったし、時間切れの案内もなかったので、変だな、とは思っていたんですけどね。
    会計の伝票をみたらえっらい予算オーバーでビックリしました。
    店長さんと協議の結果、飲み放題＋αで大幅な値引きに成功。でも追加徴収になっちゃって、ほんとごめんなさいです。
