- id: 1356
  author: 柘植圭司
  date: '2008-07-20 23:31'
  timezone: '+09:00'
  body: |-
    こんにちは、ポットベリーです。無事イギリスに着き、仕事も順調のようですね。ドイツビールやソーセイジ？（ウインナー）、塩入さんの手作り料理もとても美味しそうで私も食べたいです。
    　料理の写真も良いのですがイギリスの風景や、出来ればパツキンの写真も載せて頂ければ嬉しいのですが？。
    　なれない土地で大変ですが、（体重増にも注意して）頑張って下さい。
- id: 1357
  author: しおいり
  date: '2008-07-21 04:55'
  timezone: '+09:00'
  body: |-
    パツキン…
    きっとポットベリーさんなら、目のやり場に困ってしまうでしょうね、この国の女性には。
    短い夏を謳歌しようと、年齢を問わず露出が多めです。
    この週末からは学校も夏休みのようなので、来るなら今がチャンスですよ。お待ちしてます。
