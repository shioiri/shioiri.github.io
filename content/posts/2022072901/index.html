<p>スキー部の先輩たちとの飲み会に名称がつきました。別所線沿線でお店を探して回る「丸窓会」。いきなり沿線からは外れてしまっているけど、今回はジンギスカン食べ放題の十一屋さんで開催しました。</p>



<p>味付マトン肉と、たっぷりの野菜、そこにうどんも入った器をきれいに空けないとおかわりをオーダーできないしくみで、もうお腹いっぱいです。ごちそうさまでした。</p>
