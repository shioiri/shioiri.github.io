<p>会社の集団検診、毎年のことながら肝機能のデータが悪いので、主治医の先生に診てもらいました。</p>
<!--more-->

<p>今年言われたこと<br />
『せっぱ詰まってるってことを認識しなさい。』<br />
本気で体重を減らさないと、もう後がないそうです。<br />
あど、絶対禁酒。<br />
ふだんは飲まないしおいりも、飲み会の席ではついおつきあい。<br />
<strong>病気持ちだということを宣伝して、皆に協力してもらいなさい。</strong><br />
だそうなので、みなさん、しおいりにお酒をすすめないでください。</p>
