  body: |-
    毎日美味しそうなものでうらやましいです。
    こちらにはいつまでいますが？
    時間があったらお出かけください。
    あちらに行っても身体に気をつけてやってください。
    メタボが心配です。
    松本　ゆう子叔母
- id: 1774
  author: しおいり
  date: '2010-12-31 08:11'
  timezone: '-05:00'
  body: |-
    ありがとうございます。
    一人で暮らしている間はそれなりに気を使っているつもりですが、
    帰省すると、つい油断してしますね。ご心配おかけし恐縮です。
    ３日に帰ります。いつも失礼して申し訳ないです。
