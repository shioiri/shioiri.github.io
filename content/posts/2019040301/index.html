<p>メールの送り先、CCから外したり、BCCで流したり、一般的に行われているであろう気遣いは誰かに教わったわけでなく、長い時間をかけて身についたもの。ある程度の職位にいる人なら当然解ってるはず、と思ったら、そうではないんだなということを感じた。</p>
<p>ちょっと気になって調べたら、大問題に発展しそうなことを未然に防止。我ながらファインプレー。今日は好調でした。</p>
