  body: |-
    一気に広がったようで、少し怖いですね。やはり人口密度が高いからですかね。
    こちらは毎日ぽつぽつと数は増えていますが、この件数には既に治癒した患者さんの数も含まれているそうですので、急速な広まりは抑えられているようです。
