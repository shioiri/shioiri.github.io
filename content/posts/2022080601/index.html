<p>大雨でたいへんな被害が出ているところがあるけど、東信州はなんともない感じ。しかし日中は暑いが朝夕はまるで秋のよう。すぐに秋になって、冬が来てしまうのだ。仕事は少しずつでも続けないと…。</p>
