    出石のそばは、上田藩主仙石秀忠が上田から移封させられたときに、上田から蕎麦職人を引き連れていったのが始まり。
    だから、出石の蕎麦のルーツは上田ってことなんですね。出石はそこから発展して「少皿５枚盛り」の独自文化が生まれたんだけどね
