<p>母の誕生日で「料理思考室 かご」さんへ。ご店主の川井田さんは母と上松屋で一緒に働いていた同級生だそう。女将さんも交え三人で話がはずみ、それを僕たち夫婦が見て笑うといった構図に。しかも、ありがたいことにドリンク代はオンザハウス。みんなに喜んでもらえたようで、よかった。</p>
