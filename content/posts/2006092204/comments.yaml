- id: 597
  author: 溶接屋
  date: '2006-09-23 22:59'
  timezone: '+09:00'
  body: |-
    私がサラリーマンだった頃、ミヤノさんへ営業に行っては毎月1000万円前後売り上げていました。
    もっと仕事を出したいから工場を増築しろと言われ、ハイそうですかと二億の大借金をして設備投資した。
    そして、新工場がやっと稼働し始めたある月、突然10万円しか仕事が無くなってしまった。慌ててミヤノ側に説明を求めると、
    担当者の返事は、こんなはずじゃなかった、すみません…でした。
    もちろん私の会社は傾き、倒産寸前。給料も減り、ボーナスはゼロ、結婚して子供が生まれたばかりなのに収入がない。
    本当に辛かった…
    そんな事を今思い出した。
    あれから約15年…
    あの様な悲惨な思いを協力会社にさせなくて済むよう、是非とも優良企業として発展してもらいたいと思う。
- id: 598
  author: しおいり
  date: '2006-09-24 09:43'
  timezone: '+09:00'
  body: |-
    ひどい話です。
    地元の協力会社がなければメーカーなんてやっていけないのに、
    遠方の業者と比較してみたり、納入金額を一律何パーセントカットとか、
    どっちが協力してもらっているのだか判らなくなりますよね。。。
    そういう歴史の上に今があるということも決して忘れてはいけません。
