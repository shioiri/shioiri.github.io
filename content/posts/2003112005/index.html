ラッパのリハーサルがなかなか始まりません。ドームの雰囲気を楽しむことにしましょう。<br />
<img src="https://shioiri.jp/tomo/image/P1010045.jpg" alt="画像" /><br />
カメラマン席の電話機。幾度となくファウルボールに直撃を受けているようです。<br />
<img src="https://shioiri.jp/tomo/image/P1010048.jpg" alt="画像" /><br />
人工芝の上に寝そべってみました。本物の芝生に近い感触です。<br />
<img src="https://shioiri.jp/tomo/image/P1010049.jpg" alt="画像" /><br />
こんな高い天井、初めて見ました。<br />
<img src="https://shioiri.jp/tomo/image/P1010047.jpg" alt="画像" /><br />
横を向いてみましょう。<br />
細かい砂も混じっているので、歩き続けると靴の中に砂が入ってしまいます。<br />
