場所を移し、久々にラーメンで締めてきました。<br />
僕のいない間にオープンしていたここ、いかにも中国な感じが僕好み。店員さんに日本語はカタコトだし、掲示物の怪しさも最高。それにお味も上々。ハッカクが入っているから、らしいんですが、この麻婆麺も後味がエキゾチックでした。<br />
しかし日本の飲み会はよく食う…ということを改めて実感。あと、僕の中国語は忘却の彼方へ行ってしまっていたことも。にわか仕込みはやっぱダメだねぇ。</p>
