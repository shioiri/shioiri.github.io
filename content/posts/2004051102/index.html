<p><img alt="door.png" src="https://ext.netlify.app/door.png" width="100" height="100" border="0" /><br />
大きな壁。その壁にぶつかる前、はるか手前で途方に暮れている。<br />
どうせ飛び越えられない。壊せない。<br />
でも、その壁には、どこかに扉があるのかも。<br />
扉を探そう。そして、その扉を開こう。<br />
意外なほど軽い力で、その扉は開くのかもしれない。</p>
