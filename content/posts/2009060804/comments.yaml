  body: |-
    まいどでーす。
    しおちゃんは、ここぞととばかりにエンジョイしているようで羨ましいかぎり。
    恒例の小学校バザーのライブは６／６に無事終了しました。
    アンコール含めて、全９曲。５０分間の演奏でした。
    帰国したら、是非連絡下さい。そして、メンバーにお土産話聞かせて下さい。
    バンド練習は月２回、木曜日にいつもの場所でやってます。
    あとわずかですが、気をつけて帰ってきて下さい。
