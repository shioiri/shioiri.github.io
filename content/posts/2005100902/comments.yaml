  body: |-
    はじめまして。
    先日はメールをありがとうございました。
    ガセネタ通信をご紹介いただいて、本当にうれしいです。
    最近ネタ切れで、産みの苦しみを味わっておりますが、マイペースでシコシコがんばりたいと思っています。
    これからも時々覗いてくださいね。
    看板コーナーもぜひ見てくださいませ。では、これからもよろしく。
