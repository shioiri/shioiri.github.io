<p>「エンたま」こと、<a href="http://tamagotch.channel.or.jp/">超じんせーエンジョイたまごっちプラス</a>が本日発売だったそうで、ラオックスやジャスコではけっこうな騒ぎになっていたという話ですが、たまたま軽井沢ショッピングプラザへ買い物に行った分団長によれば、<a href="http://www.worldtoy.jp"/>バンダイワールドトイミュージアム</a>ではフツーに山積みで売られていたとのこと。発売前からプレミアム価格がついちゃうようなモノなら、僕にも買ってきてくれたらうれしかったのに！<br />
たまごっち好きのみなさん、軽井沢・・・穴場かもしれませんよぉ。</p>
