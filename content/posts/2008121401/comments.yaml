- id: 1424
  author: おおぜき
  date: '2008-12-16 03:33'
  timezone: '+00:00'
  body: |-
    年末年始は、日本でお過ごしですか？久しぶりに、飲みたいですね！
    １４日の日曜日に、両角君が結婚しました（Ｔｂ成沢と）知ってた？
- id: 1425
  author: 山の上
  date: '2008-12-16 09:11'
  timezone: '+00:00'
  body: |-
    お久しぶりです。日本は、今日も冷えこんで来ました。１２月１６日午後６時です。
    とんでもない不景気に襲われ、やな予感の中にいます。
    年末に、帰国ですね。また、夜警で会えますか？土産話を楽しみにしております。
- id: 1426
  author: しおいり
  date: '2008-12-16 22:24'
  timezone: '+00:00'
  body: |-
    帰国＝イギリスへ帰ってくるって意味でして、
    今のところ日本に帰る予定はございません。
    出初式で蛍の光やってくれるんなら帰ろっかなー。
    （うそうそ）
- id: 1427
  author: 山の上
  date: '2008-12-17 11:24'
  timezone: '+00:00'
  body: 了解！久々に会えるかと思いましたが、そうですかー日本は、日に日に年末らしくなって来ました。雪の無いクリスマスになりそうです。
