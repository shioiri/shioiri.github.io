- id: 1418
  author: 上田市消防団第一班
  date: '2008-12-01 11:55'
  timezone: '+00:00'
  body: |-
    野良ムセン使っているためアドレスはありません（笑）
    さーまぁーさん、まもさん、ゆう、にし、より詰所から愛を込めて（＾＾
    ただいまの時刻、１２月１日広報が終わった時間帯です♪
    長野は寒いです。
    ところでさぁまぁさんが上海から帰ってきました。ご飯はまずかったそうです。
    年末に帰ってきたら、夜景にはチーズフョンデュをご用意しますね（＾＾v
    去年から、１班の伝統料理になった噂の「チーズフォンデュ」です♪
    ご飯もあまりカロリー計算しすぎると逆に太りますよww
    それでは、お体お気をつけて（＾＾
    またお会いできるのを楽しみにしております。
    駄文、長文失礼しました。
- id: 1419
  author: しおいり
  date: '2008-12-01 21:49'
  timezone: '+00:00'
  body: |-
    どーもどーも。こちらは今お風呂にお湯を貯めながら書いてます。
    一班の詰所で野良無線拾うんかい？！
    便利な世の中になったものだねぇ。
    年末年始はたぶん帰りませんよ。
    いつか出初式の蛍の光で送ってもらう日を楽しみにしてたんですけどね。
