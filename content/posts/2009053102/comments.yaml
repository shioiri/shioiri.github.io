  body: |-
    あと一ヶ月なんですね、一年が早いものです。
    昨日、講義で小学校時代の写真を見せてから君とのストックでの
    アイスバーの写真を学生に紹介し、友情の重みを教えました。
    帰国したらいつか僕の学生に英国での一年をお話してね。
