<p>昨夜飲み食いし過ぎた結果で朝食抜き。お昼もいらない感じだったが、お客さんの休み時間にしなきゃと思い近くの中華。看板メニューの「鑫源飯」をチョイスするもイマイチ…。夕食はミヤノの先輩（恐らく初対面）よりお声がけいただき金山の山ちゃんで一杯。先輩からお話を聞いて、お代も出していただいてしまうという昔の勤務先の流儀に有り難く感謝し甘えてきました。ごちそうさまでした〜</p>
