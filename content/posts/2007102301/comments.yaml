- id: 1084
  author: はる
  date: '2007-10-24 10:47'
  timezone: '+09:00'
  body: |-
    くだんの読者投稿を読みました。
    年齢を見ると同世代のようですが、子供はいないんじゃないかと思います。子供の安全上の問題と、大人たちのマナーの問題をゴッチャにしておいて、「社会がすさんできていて嘆かわしい」という雰囲気に持って行っちゃってるように思います。
    安全確保とマナー向上の2つの面があるってことを踏まえたうえで議論してもらうと、建設的な方向に進むんじゃないでしょうかね。
