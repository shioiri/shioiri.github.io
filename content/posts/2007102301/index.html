<p>きのう、食後の散歩を楽しんでいたら、こんにちはと知らない人から声をかけてもらいました。<br />
風邪をひいて一週間サボっていたのですが、こんなちょっとしたあいさつで気分も晴れやかになるものです。<br />
でも今朝の新聞、読者投稿をみてちょっと驚いちゃいました。<br />
登下校中のこどもたちに挨拶していたら、知らない人に声をかけられても応じないよう学校では指導しているので、そんなことやめるよう言われたそうです。<br />
こんなことってあるんですかねぇ。<br />
