    この時期は、農協系は高校入試で売り切れのところが多いですよね。
    やはり、合同庁舎の売店か警察署とかにはありそうですが。
- id: 1271
  author: しおいり
  date: '2008-03-24 13:46'
  timezone: '+09:00'
  body: |-
    証紙は農協で買ってきてください！って学校に言われたので、
    秋和のJAに行ってみたら店舗閉鎖されてたのね。
    で、金融機関ならどこでもいいかと思って常磐城の
    しんきんへ行ってみたら
    「ここにはないよ、近いとこなら郵便局だね」と案内されて、
    郵便局へ行ってみたら
    「印紙はあるけど証紙は農協ですよ」って言われちゃった。
    自信マンマンで本所の窓口に400円差し出したら、
    「本所では扱ってないので商工会議所前の支所へ」だって。
    雨の中、クルマだから良かったけど、
    徒歩で回ってたらガックリきちゃうよね。
- id: 1272
  author: KIPS
  date: '2008-03-24 16:47'
  timezone: '+09:00'
  body: |-
    川辺店や塩田支所とかにはありますね。
    収入証紙
    きっと大昔の個別農協時代に受託しているので、
    あるところと無いところが分かれていますね。
