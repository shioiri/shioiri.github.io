- id: 41
  author: はる
  date: '2004-01-29 10:00'
  timezone: '+09:00'
  body: |-
    一昨日くらいから Novarg(Mimail, Mydoom) ウイルスメールが大量に届くようになりました。しかも私のアドレスが From に使われているようで、各地のメールサーバから「ウイルスが入っているから配送できませんでした」というメールもあるので結構な量になっています。
    私の会社では Outlook Express は使ってはならないというキマリで運用していますので、いまのところ実害は出ていないようです。
    ウイルスに感染して大騒ぎになることを考えると、面倒でも Outlook Express を追放する方策を考えたほうが建設的かもしれませんね。
- id: 42
  author: しおいり
  date: '2004-01-29 16:27'
  timezone: '+09:00'
  body: |-
    コメントをありがとうございます。
    届くメールのほとんどはプロバイダからの「ウィルスがあったから削除したよ」メールなんですが、
    あまりにひどいので、昨夜のうちにケータイへの転送は止めました。
    いま、もうひとつ困っているのは、このブログへのスパムコメント。
    なんとか対策しないと、削除が面倒で困ります。
