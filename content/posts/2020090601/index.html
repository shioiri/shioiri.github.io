<p>術後すぐのお粥。おかずもやわらかいものになると聞いていたんだけどなぁ。食欲なく、パス。</p>



<figure class="wp-block-image size-full"><img src="https://shioiri.wordpress.com/wp-content/uploads/2023/06/20200905224700.jpg" alt="" class="wp-image-10801" /></figure>



<p>翌朝も食欲なく牛乳だけ。帰宅して桃、夕食は混ぜて飲み込むスタイルに。</p>



<figure class="wp-block-image size-full"><img src="https://shioiri.wordpress.com/wp-content/uploads/2023/06/20200905224705.jpg" alt="" class="wp-image-10800" /></figure>



<p>朝は普通に食べてみたけど口の中が汚れてしまう感じがして、お昼からは飲み込めるものに変えてもらいました。</p>



<p>しばらくは不自由が続く感じ。</p>
