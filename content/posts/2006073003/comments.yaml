  body: |-
    ラッパのお手伝い参加お疲れで大金を使って前泊までして４位とか５位とかだったらヒンシュクだろうね～、などと数週間前に団幹部と話をした。
    さらに今回、Ｓ坂市は音楽隊員を参加させずに純粋にラッパ員だけで出場すると聞いていたので、多少は期待したが、この結果が実力でしょう。
    講師の質の問題も含め、今後風当たりが厳しくなりそうだ。
- id: 543
  author: yo-☆setuya
  date: '2006-07-31 09:08'
  timezone: '+09:00'
  body: あれ？「お疲れでした」って書いた筈が「した」が抜けてしまいました。
- id: 544
  author: しお
  date: '2006-07-31 09:34'
  timezone: '+09:00'
  body: |-
    ご声援ありがとうございました。
    今回は宮島副ラッパ長を中心に、とてもいい音作りができていたと思います。
    上田は上田なりの練習を重ね、本番ではその実力を発揮しましたから、
    メンバーは一様に満足していたようです。
    でも結果は残念。
    原因はハッキリしているらしいので、
    総括して、来年につなげていくことでしょう。
