- id: 636
  author: 土曜日の信毎に載り損ねた奴
  date: '2006-11-22 13:05'
  timezone: '+09:00'
  body: |-
    土曜の信毎…ラッパチーム写ってないじゃん！
    過去３回は、オイラ・でかデカと載ったこと有るから別に良いけど。
    Ｙ先輩…
    昔はよくＨＰ覗きに来てくれていたようなんですけどね。
    Ｙ先輩に頼まれて、ラッパＣＤ作ったコト。
    Ｙぁまぁざぁきぃ～　Ｙぉしぃひぃとぉ～
    と２人してジャイアン様にどやさ…
    指導していただいたコト。
    ２人してちびっ子だったコト。
    Ｙ先輩が居たからラッパ頑張れた時期だったなぁ～
    今度納品行ったら、覗いて来よっと！
