  body: |-
    工藤すごいね。
    ２００勝だよ、２００勝。
    なにをかくそう、同い年なんです。
    ついでに、引退した槙原も。同じ愛知県出身で。
    懐かしい、遠い記憶です。
    野球小僧だったころ‥
    何回か対戦しましたが、勝った記憶がありません。
    ソーダヨネ。勝ってれば、今頃、鍛冶屋なんかやってませんて。
    体の続く限りがんばってほしいものです。
- id: 111
