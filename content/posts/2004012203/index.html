<p>どうやら猛威をふるっているらしいインフルエンザですが、<br />
幸いにも僕の周りではまだ菌に冒された人を見かけません。<br />
それよりも、鳥インフルエンザ騒ぎが気になるところです。<br />
アメリカ狂牛病騒ぎの次は、タイの鳥インフルエンザ。<br />
国内で消費される鶏肉の1割がタイ産だったなんて知りませんでした。<br />
すかいらーくい至っては7～8割がタイ産なんだって。<br />
焼鳥丼に活路を求めた吉野屋も15%がタイ産だとか。<br />
モーこりゃ踏んだり蹴ったりですな。</p>
