- id: 1018
  author: T・チョッと・チン
  date: '2007-08-20 12:52'
  timezone: '+09:00'
  body: |-
    暑い中の応援ありがとうございました。
    まだまだ立ち上げて６試合、問題点もたくさんあります。どうか長い目で見守っていただけたらと思います。
    今後も長野県のエンターテイメントのど真ん中をいけるよう、トレーニングを積んでいきたいと思ってます。ペナテス隊長にもよろしくお伝えください。
- id: 1019
  author: しおいり
  date: '2007-08-20 20:37'
  timezone: '+09:00'
  body: |-
    お疲れさまでした。
    ペナ長の黄色いチンコールに期待してたんですがイマイチ不発でしたね…
- id: 1020
