  body: |-
    塩入君；
    ニュースを見ていて無事とは分かっていても、ちょっと心配しました。
    毎年どこかで震度６はあるね。
    東北もいつかはあるな。
    避難所暮らしの不便さと心的なダメージは体験しないと分かりませんね。
- id: 954
  author: 内海美和
  date: '2007-07-18 02:20'
  timezone: '+09:00'
  body: |-
    お久しぶりです。地震大丈夫そうで安心しました。こちらも少し揺れましたが６ヶ月なる子を抱っこしてあやしていたのでわかりませんでしたよ。（いつでもゆらゆらしてるので）
    とうとう桃三も統合して桃花になるそうで｡2こ下の妹の渡部クラスも今年初クラス会するそうです。
- id: 955
  author: しおいり
  date: '2007-07-18 07:55'
  timezone: '+09:00'
  body: |-
    どうも。ご心配いただきありがとう。
    >ミックン
    いま見える山々も、地殻の運動や風雨の浸食でできたもの。
    つまりは、どこでも災害は起こり得るということだ。
    そんなことを通勤中のクルマを運転しながら感じました。
    田舎っていいねぇ。
    >みわちゃん
    お母さんになってたとは知らなかった！
    幸せそうな姿が目に浮かびます。
