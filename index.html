<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>最新記事一覧 - Tomohiro Shioiri Archive</title>
    <link rel="stylesheet" href="assets/css/style.css">
    <style>
        /* ==========================================================================
           純CSSハンバーガーメニュー（ホバー時に三本線から✕へアニメーション）
           ========================================================================== */
        #menu-toggle { display: none; }
        
        .menu-btn {
            cursor: pointer;
            float: right;
            position: relative;
            width: 30px;
            height: 24px;
            display: block;
            z-index: 10;
        }
        
        .menu-btn span,
        .menu-btn span::before,
        .menu-btn span::after {
            content: '';
            display: block;
            height: 2px;
            width: 100%;
            background-color: #111111;
            position: absolute;
            transition: all 0.3s ease-in-out;
        }
        
        .menu-btn span { top: 11px; }
        .menu-btn span::before { top: -8px; }
        .menu-btn span::after { top: 8px; }
        
        #menu-toggle:checked ~ .menu-btn span,
        .menu-btn:hover span {
            background-color: transparent;
        }
        #menu-toggle:checked ~ .menu-btn span::before,
        .menu-btn:hover span::before {
            transform: rotate(45deg);
            top: 0;
        }
        #menu-toggle:checked ~ .menu-btn span::after,
        .menu-btn:hover span::after {
            transform: rotate(-45deg);
            top: 0;
        }
        
        .nav-menu {
            display: none;
            list-style: none;
            padding: 15px 0;
            border-top: 1px solid #e5e5e5;
            clear: both;
        }
        #menu-toggle:checked ~ .nav-menu {
            display: block;
        }
        .nav-menu li { margin: 12px 0; }
        .nav-menu a { text-decoration: none; font-weight: 600; }
        
        /* Google翻訳ウィジェットのコンテナ調整 */
        .translation-box {
            margin-top: 15px;
            padding-top: 10px;
            border-top: 1px dashed #e5e5e5;
        }
        
        header { padding-bottom: 20px; border-bottom: 1px solid #e5e5e5; margin-bottom: 30px; }
        .post-date-meta { color: #666666; font-size: 0.9rem; margin-bottom: 20px; display: block; }
        
        .archive-list { list-style: none; padding-left: 0; }
        .archive-list li { padding: 10px 0; border-bottom: 1px solid #f5f5f5; display: flex; justify-content: space-between; }
        .archive-list .date { color: #666666; font-size: 0.9rem; margin-left: 15px; }
    </style>
</head>
<body>
    <div class="wrapper">
        <header>
            <h1><a href="index.html" style="color:inherit; text-decoration:none;">Tomohiro Shioiri</a></h1>
            <p>アーカイブウェブサイト</p>
            
            <input type="checkbox" id="menu-toggle">
            <label for="menu-toggle" class="menu-btn"><span></span></label>
            
            <ul class="nav-menu">
                <li><a href="index.html">ホーム (最新記事)</a></li>
                <!-- プロフィールページへの静的リンクを追加 -->
                <li><a href="profile.html">プロフィール</a></li>
                <!-- Google翻訳の表示エリア -->
                <li class="translation-box">
                    <div id="google_translate_element"></div>
                </li>
            </ul>
        </header>
        
        <section>
            <h2>最新記事一覧</h2>
            
            
            <article>
                <ul class="archive-list"><li><a href='2026/07/19/01.html'>初めての静的ブログ生成</a><span class='date'>2026-07-19</span></li></ul>
            </article>
        </section>
        
        <footer>
            <p><small>Hosted on GitHub Pages — Theme by orderedlist</small></p>
        </footer>
    </div>

    <!-- Google翻訳の自動実行スクリプト（非同期インクルード） -->
    <script type="text/javascript">
        function googleTranslateElementInit() {
            new google.translate.TranslateElement({
                pageLanguage: 'ja',
                includedLanguages: 'en,zh-CN,ko,es,fr', /* 翻訳対象：英、中、韓、西、仏 */
                layout: google.translate.TranslateElement.InlineLayout.SIMPLE
            }, 'google_translate_element');
        }
    </script>
    <script type="text/javascript" src="//translate.google.com/translate_a/element.js?cb=googleTranslateElementInit"></script>
</body>
</html>
